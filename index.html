<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD/PROJ — ZAKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:     #1e1008;
  --ink2:    #4a2e14;
  --ink3:    #7a5c3a;
  --ink4:    #a88c6a;
  --bg:      #f0e4d0;
  --surface: #fdf6ee;
  --border:  #d9c4aa;
  --accent:  #b05c2a;
  --accent2: #7a3010;

  --col-ongoing:    #1a5fa8; --col-ongoing-bg: #dbeafe;
  --col-done:       #1e7a44; --col-done-bg:    #d1fae5;
  --col-pending:    #b45309; --col-pending-bg: #fef3c7;
  --col-paused:     #6b7280; --col-paused-bg:  #f3f4f6;
  --col-edit:       #1d4ed8; --col-edit-bg:    #eff6ff;
  --col-export:     #6d28d9; --col-export-bg:  #f5f3ff;
  --col-del:        #b91c1c; --col-del-bg:     #fef2f2;

  --proj-0:#c0622a; --proj-1:#2563a8; --proj-2:#1e7a44;
  --proj-3:#a0448a; --proj-4:#b07820; --proj-5:#5040b0;
  --proj-6:#1878a0; --proj-7:#a83030; --proj-8:#4a8820; --proj-9:#885020;

  --r: 10px; --r-sm: 6px; --r-pill: 100px;
  --shadow: 0 2px 8px rgba(80,40,10,0.10);
  --shadow-lg: 0 4px 20px rgba(80,40,10,0.16);

  /* ── 字體 ── */
  --font: 'Noto Sans TC', sans-serif;
  --mono: 'DM Mono', monospace;

  /* 全面放大2級：base 16px */
  font-size: 18px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 500;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── HEADER ─── */
header {
  background: var(--ink2);
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  position: sticky;
  top: 0;
  z-index: 200;
}
.logo-main {
  font-size: 1.25rem;
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.04em;
}
.logo-sub {
  font-size: 0.8rem;
  font-weight: 500;
  color: rgba(255,255,255,0.5);
  margin-left: 12px;
  letter-spacing: 0.1em;
}
.btn-logout {
  font-family: var(--font);
  font-size: 0.8rem;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: var(--r-pill);
  padding: 6px 16px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-logout:hover { background: rgba(255,255,255,0.2); color: #fff; }

/* ─── NAV ─── */
.nav-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  display: flex;
  position: sticky;
  top: 58px;
  z-index: 190;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-bar::-webkit-scrollbar { display: none; }
.nav-tab {
  font-family: var(--font);
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--ink4);
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  padding: 14px 18px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  letter-spacing: 0.06em;
}
.nav-tab:hover { color: var(--ink2); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── LAYOUT ─── */
.container { max-width: 1400px; margin: 0 auto; padding: 32px 40px 80px; }
@media (max-width: 640px) { .container { padding: 16px 16px 60px; } header, .nav-bar { padding-left: 16px; padding-right: 16px; } }
.page { display: none; }
.page.active { display: block; }

/* ─── STATS ─── */
.stats-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
@media (max-width: 600px) { .stats-bar { grid-template-columns: repeat(2,1fr); } }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s, transform 0.15s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-label { font-size: 0.75rem; font-weight: 700; color: var(--ink4); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
.stat-value { font-family: var(--mono); font-size: 2.6rem; font-weight: 500; color: var(--ink); line-height: 1; margin-bottom: 4px; }
.stat-sub { font-size: 0.8rem; color: var(--ink4); }

/* ─── TOOLBAR ─── */
.toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.toolbar-left { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-pill {
  font-family: var(--font); font-size: 0.8rem; font-weight: 700;
  padding: 6px 16px; border-radius: var(--r-pill);
  border: 1px solid var(--border); background: var(--surface); color: var(--ink3);
  cursor: pointer; transition: all 0.15s;
}
.filter-pill:hover { border-color: var(--ink4); color: var(--ink2); }
.filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-add {
  font-family: var(--font); font-size: 0.9rem; font-weight: 700;
  background: var(--accent); color: #fff; border: none;
  padding: 9px 22px; border-radius: var(--r-sm); cursor: pointer;
  box-shadow: 0 2px 8px rgba(176,92,42,0.35); transition: all 0.15s;
}
.btn-add:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(176,92,42,0.4); }

/* ─── PROJECT CARDS ─── */
.projects-grid { display: flex; flex-direction: column; gap: 10px; }
.project-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; transition: all 0.15s;
}
.project-card:hover { box-shadow: var(--shadow-lg); border-color: var(--ink4); }
.project-card.is-open { border-color: var(--ink3); box-shadow: var(--shadow-lg); }

.card-header {
  display: grid; grid-template-columns: 44px 1fr auto auto;
  align-items: center; padding: 16px 18px; gap: 14px;
  cursor: pointer; user-select: none; transition: background 0.12s;
}
.card-header:hover { background: var(--bg); }
.project-card.is-open .card-header { background: var(--bg); border-bottom: 1px solid var(--border); }
@media (max-width: 480px) { .card-header { grid-template-columns: 34px 1fr auto auto; gap: 8px; padding: 12px 14px; } }

.card-num { font-family: var(--mono); font-size: 0.75rem; color: var(--ink4); }
.card-title { font-size: 1.15rem; font-weight: 900; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 0.78rem; color: var(--ink4); margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
@media (max-width: 480px) { .card-title { font-size: 0.9rem; } }

.status-pill {
  font-family: var(--font); font-size: 0.75rem; font-weight: 700;
  padding: 4px 12px; border-radius: var(--r-pill); border: 1px solid; white-space: nowrap;
}
.s-ongoing   { background: var(--col-ongoing-bg);  color: var(--col-ongoing);  border-color: var(--col-ongoing); }
.s-completed { background: var(--col-done-bg);     color: var(--col-done);     border-color: var(--col-done); }
.s-pending   { background: var(--col-pending-bg);  color: var(--col-pending);  border-color: var(--col-pending); }
.s-invoicing { background: #fdf4ff; color: #7e22ce; border-color: #d8b4fe; }

.card-chevron { font-size: 12px; color: var(--ink4); transition: transform 0.2s; width: 20px; text-align: center; }
.card-chevron.open { transform: rotate(180deg); }

/* ─── CARD BODY ─── */
.card-body { display: none; padding: 16px 18px; }
.card-body.open { display: block; }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tag { font-family: var(--font); font-size: 0.75rem; font-weight: 700; padding: 3px 12px; border-radius: var(--r-pill); border: 1px solid; }
.tag-client  { background: #2c1e0f18; color: var(--ink2); border-color: var(--border); }
.tag-contact { background: var(--col-export-bg); color: var(--col-export); border-color: #c4b8f0; }
.tag-photo   { background: var(--col-pending-bg); color: var(--col-pending); border-color: #f0d080; }

.ms-section { margin-bottom: 14px; }
.ms-section-label { font-size: 0.72rem; font-weight: 700; color: var(--ink4); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.ms-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--r-sm); margin-bottom: 3px; background: var(--bg); transition: background 0.12s; }
.ms-row:hover { background: #e8d8c0; }
.ms-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.ms-dot.done        { background: var(--col-done); }
.ms-dot.in-progress { background: var(--col-ongoing); box-shadow: 0 0 0 3px rgba(26,95,168,0.2); }
.ms-dot.upcoming    { background: #fff; border: 2px solid var(--border); }
.ms-name { font-size: 0.88rem; font-weight: 700; color: var(--ink); flex: 1; }
.ms-status { display: none; }
.ms-status.done { display: inline; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); background: var(--col-done-bg); color: var(--col-done); border: 1px solid var(--col-done); }
.ms-date { font-family: var(--mono); font-size: 0.8rem; color: var(--ink3); min-width: 85px; text-align: right; }
.ms-date.empty { color: var(--border); }
@media (max-width: 480px) { .ms-date { min-width: 65px; font-size: 0.72rem; } }

.card-notes-text { font-size: 0.82rem; color: var(--ink3); background: var(--bg); border-left: 3px solid var(--border); padding: 10px 14px; margin-top: 12px; line-height: 1.7; white-space: pre-wrap; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.card-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.btn-action {
  font-family: var(--font); font-size: 0.8rem; font-weight: 700;
  padding: 6px 16px; border-radius: var(--r-sm); border: 1px solid var(--border);
  background: var(--surface); color: var(--ink2); cursor: pointer; transition: all 0.15s;
}
.btn-action:hover { background: var(--bg); }
.btn-action.edit   { color: var(--col-edit);   border-color: var(--col-edit);   background: var(--col-edit-bg); }
.btn-action.edit:hover   { background: #d0e8ff; }
.btn-action.export { color: var(--col-export); border-color: var(--col-export); background: var(--col-export-bg); }
.btn-action.export:hover { background: #e5ddfb; }
.btn-action.danger { color: var(--col-del); border-color: var(--col-del); background: var(--col-del-bg); }
.btn-action.danger:hover { background: #fdd8d8; }

/* ─── EMPTY ─── */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 2.5rem; color: var(--border); display: block; margin-bottom: 12px; }
.empty-text { font-size: 0.95rem; color: var(--ink4); }

/* ─── GANTT ─── */
.view-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.month-label { font-size: 1.4rem; font-weight: 900; color: var(--ink); min-width: 160px; }
.btn-nav {
  font-family: var(--mono); font-size: 1rem;
  width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.btn-nav:hover { background: var(--bg); border-color: var(--ink4); }
.btn-today {
  font-family: var(--font); font-size: 0.8rem; font-weight: 700;
  padding: 6px 16px; border-radius: var(--r-pill); border: 1px solid var(--border);
  background: var(--surface); color: var(--ink3); cursor: pointer; transition: all 0.15s;
}
.btn-today:hover { background: var(--bg); }

.gantt-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.gantt-table { border-collapse: collapse; width: 100%; min-width: 600px; }
.g-th { padding: 9px 2px; text-align: center; font-family: var(--mono); font-size: 0.7rem; color: var(--ink4); border-bottom: 1px solid var(--border); }
.g-th.today-h { color: var(--accent); font-weight: 700; background: #fdf0e8; }
.g-th.weekend { color: var(--border); }
.g-label-td { position: sticky; left: 0; z-index: 2; background: var(--surface); padding: 8px 14px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); width: 170px; min-width: 150px; vertical-align: middle; }
.g-proj-name { font-size: 0.82rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.g-proj-client { font-size: 0.72rem; color: var(--ink4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.g-day-td { padding: 5px 2px; text-align: center; border-bottom: 1px solid var(--border); }
.g-day-td.today-h { background: #fdf0e8; }
.g-day-td.weekend { background: var(--bg); }
.g-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; cursor: pointer; transition: transform 0.12s; margin: 1px; vertical-align: middle; }
.g-dot:hover { transform: scale(1.7); }
.g-tooltip { position: fixed; background: var(--ink); color: #fff; font-family: var(--font); font-size: 0.78rem; font-weight: 600; padding: 7px 13px; border-radius: var(--r-sm); pointer-events: none; z-index: 500; white-space: nowrap; display: none; box-shadow: var(--shadow-lg); }

/* ─── CALENDAR ─── */
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
.cal-head { text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--ink4); padding: 6px 0; letter-spacing: 0.06em; text-transform: uppercase; }
.cal-day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); min-height: 74px; padding: 6px; cursor: pointer; transition: all 0.15s; overflow: hidden; }
.cal-day:hover { border-color: var(--ink4); }
.cal-day.has-ev { border-color: var(--ink3); box-shadow: 0 1px 5px rgba(80,40,10,0.1); }
.cal-day.is-today { border: 2px solid var(--accent); background: #fdf0e8; }
.cal-day.other-m { background: var(--bg); }
.cal-day.is-past { opacity: 0.38; }
.cal-day.is-past:hover { opacity: 0.6; }
.cal-day.other-m .cal-dn { color: var(--border); }
.cal-dn { font-family: var(--mono); font-size: 0.75rem; font-weight: 500; color: var(--ink3); margin-bottom: 4px; }
.cal-day.is-today .cal-dn { color: var(--accent); font-weight: 700; }
.proj-chip { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.cal-detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 24px; margin-top: 14px; }
.cal-detail-title { font-size: 1rem; font-weight: 900; color: var(--ink); margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.cal-ev-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg); border-radius: var(--r-sm); margin-bottom: 6px; flex-wrap: wrap; border-left: 4px solid var(--border); }
.cal-ev-icon { font-size: 0.8rem; flex-shrink: 0; }
.cal-ev-proj { font-weight: 700; font-size: 0.88rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-ev-ms { font-size: 0.78rem; color: var(--ink3); white-space: nowrap; }
.cal-ev-badge { font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); border: 1px solid; white-space: nowrap; }
@media (max-width: 600px) { .cal-day { min-height: 52px; padding: 4px; } .proj-chip { display: none; } .cal-day.has-ev .cal-dn::after { content: ' ●'; color: var(--accent); } }

/* ─── CLIENTS ─── */
.section-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.section-controls label { font-size: 0.78rem; font-weight: 700; color: var(--ink4); letter-spacing: 0.06em; text-transform: uppercase; }
.styled-select { font-family: var(--font); font-size: 0.88rem; font-weight: 700; padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); outline: none; cursor: pointer; }
.client-grid { display: flex; flex-direction: column; gap: 10px; }
.client-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 22px; }
.client-card-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 12px; gap: 8px; }
.client-name { font-size: 1.2rem; font-weight: 900; color: var(--ink); }
.client-count { font-family: var(--mono); font-size: 0.8rem; color: var(--ink4); white-space: nowrap; }
.contact-items { display: flex; flex-direction: column; gap: 5px; }
.contact-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 9px 13px; background: var(--bg); border-radius: var(--r-sm); gap: 10px; flex-wrap: wrap; }
.contact-item-left { flex: 1; min-width: 0; }
.contact-person { font-size: 0.88rem; font-weight: 700; color: var(--ink); }
.contact-projs { font-size: 0.78rem; color: var(--ink4); margin-top: 2px; }
.contact-item-count { font-family: var(--mono); font-size: 0.78rem; color: var(--ink3); white-space: nowrap; }

/* ─── MODAL ─── */
.modal-overlay { position: fixed; inset: 0; background: rgba(30,16,8,0.6); backdrop-filter: blur(2px); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.modal-overlay.hidden { display: none; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-lg); width: 100%; max-width: 660px; max-height: 90vh; overflow-y: auto; padding: 28px; margin: auto; }
@media (max-width: 480px) { .modal { padding: 18px 14px; border-radius: var(--r) var(--r) 0 0; max-height: 95vh; } .modal-overlay { align-items: flex-end; padding: 0; } }

.modal-title { font-size: 1.3rem; font-weight: 900; color: var(--ink); margin-bottom: 22px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
.form-row { margin-bottom: 14px; }
.form-label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--ink4); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 6px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 9px 13px; border: 1px solid var(--border); border-radius: var(--r-sm);
  font-family: var(--font); font-size: 0.9rem; font-weight: 500; color: var(--ink);
  background: var(--surface); outline: none; transition: all 0.15s; -webkit-appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(176,92,42,0.12); }
.form-textarea { resize: vertical; min-height: 70px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
@media (max-width: 480px) { .form-grid-3, .form-grid-2 { grid-template-columns: 1fr; } }

.checkbox-label { display: flex; align-items: center; gap: 10px; padding: 10px 13px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); cursor: pointer; transition: background 0.15s; }
.checkbox-label:hover { background: #e8d8c0; }
.checkbox-label input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.checkbox-label span { font-size: 0.9rem; font-weight: 600; color: var(--ink); }

.ms-form-section-title { font-size: 0.75rem; font-weight: 700; color: var(--ink4); letter-spacing: 0.08em; text-transform: uppercase; margin: 16px 0 8px; }
.ms-form-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg); border-radius: var(--r-sm); margin-bottom: 5px; }
.ms-form-name { font-size: 0.9rem; font-weight: 700; color: var(--ink); }
.ms-date-input { font-family: var(--mono); font-size: 0.82rem; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); outline: none; transition: border-color 0.15s; }
.ms-date-input:focus { border-color: var(--accent); }

.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
.btn-cancel { font-family: var(--font); font-size: 0.88rem; font-weight: 600; padding: 8px 20px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; color: var(--ink3); transition: all 0.15s; }
.btn-cancel:hover { background: var(--bg); }
.btn-save { font-family: var(--font); font-size: 0.88rem; font-weight: 700; padding: 8px 24px; background: var(--accent); color: #fff; border: none; border-radius: var(--r-sm); cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 8px rgba(176,92,42,0.35); }
.btn-save:hover { background: var(--accent2); transform: translateY(-1px); }

/* ─── EXPORT ─── */
.export-overlay { position: fixed; inset: 0; background: rgba(30,16,8,0.7); backdrop-filter: blur(3px); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 16px; }
.export-overlay.hidden { display: none; }
.export-modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; padding: 24px; }
.export-modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.export-modal-title { font-size: 1.15rem; font-weight: 900; color: var(--ink); }
.export-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--ink4); transition: color 0.15s; line-height: 1; }
.export-close:hover { color: var(--ink); }
.export-preview { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 14px; margin-bottom: 14px; overflow: auto; }
#exportCanvas { display: block; max-width: 100%; border-radius: 6px; box-shadow: var(--shadow); }
.export-footer { display: flex; gap: 8px; justify-content: flex-end; }



/* 收款狀態 */
.pay-badge { font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); border: 1px solid; white-space: nowrap; }
.pay-unpaid   { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
.pay-invoiced { background: #fefce8; color: #a16207; border-color: #fde68a; }
.pay-received { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center">
    <span class="logo-main">AD/PROJ</span>
    <span class="logo-sub">ZAKI</span>
  </div>

</header>

<div class="nav-bar">
  <button class="nav-tab active" onclick="switchPage('projects',this)">案子列表</button>
  <button class="nav-tab" onclick="switchPage('gantt',this)">甘特圖</button>
  <button class="nav-tab" onclick="switchPage('calendar',this)">日曆視圖</button>
  <button class="nav-tab" onclick="switchPage('clients',this)">客戶統計</button>
  <button class="nav-tab" onclick="switchPage('income',this)">收入總覽</button>
</div>

<div class="container">
  <div class="page active" id="page-projects">
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-label">執行中</div><div class="stat-value" id="countOngoing">0</div><div class="stat-sub">個案子</div></div>
      <div class="stat-card"><div class="stat-label">已結案</div><div class="stat-value" id="countDone">0</div><div class="stat-sub">個案子</div></div>
      <div class="stat-card"><div class="stat-label">請款中</div><div class="stat-value" id="countPending">0</div><div class="stat-sub">個案子</div></div>
      <div class="stat-card"><div class="stat-label">總案數</div><div class="stat-value" id="countTotal">0</div><div class="stat-sub">個</div></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="filter-pill active" onclick="setFilter('ongoing',this)">執行中</button>
        <button class="filter-pill" onclick="setFilter('invoicing',this)">請款中</button>
        <button class="filter-pill" onclick="setFilter('pending',this)">待確認</button>
        <button class="filter-pill" onclick="setFilter('completed',this)">已結案</button>
        <button class="filter-pill" onclick="setFilter('all',this)">全部</button>
      </div>
      <button class="btn-add" onclick="openModal()">＋ 新增</button>
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </div>

  <div class="page" id="page-gantt">
    <div class="view-controls">
      <button class="btn-nav" onclick="ganttPrevMonth()">‹</button>
      <span class="month-label" id="ganttMonthLabel"></span>
      <button class="btn-nav" onclick="ganttNextMonth()">›</button>
      <button class="btn-today" onclick="ganttGoToday()">今天</button>
    </div>
    <div class="gantt-wrap"><table class="gantt-table" id="ganttTable"></table></div>
    <div class="g-tooltip" id="ganttTooltip"></div>
  </div>

  <div class="page" id="page-calendar">
    <div class="view-controls">
      <button class="btn-nav" onclick="calPrev()">‹</button>
      <span class="month-label" id="calMonthLabel"></span>
      <button class="btn-nav" onclick="calNext()">›</button>
      <button class="btn-today" onclick="calGoToday()">今天</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-detail" id="calDetail" style="display:none"></div>
  </div>

  <div class="page" id="page-clients">
    <div class="section-controls">
      <label>統計年份</label>
      <select class="styled-select" id="yearSelect" onchange="renderClients()"></select>
    </div>
    <div class="client-grid" id="clientCards"></div>
  </div>
  <!-- 收入總覽 -->
  <div class="page" id="page-income">
    <div class="section-controls" style="gap:16px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px">
        <label style="font-size:0.78rem;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:0.06em">從</label>
        <input type="month" id="incomeFrom" class="styled-select">
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <label style="font-size:0.78rem;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:0.06em">到</label>
        <input type="month" id="incomeTo" class="styled-select">
      </div>
      <button class="btn-add" style="padding:7px 18px;font-size:0.85rem" onclick="renderIncome()">套用</button>
    </div>

    <!-- 統計卡片 -->
    <div id="incomeStats" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px"></div>

    <!-- 客戶圓餅圖 -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)">
      <div style="font-size:0.78rem;font-weight:700;color:var(--ink4);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:20px">客戶收入佔比</div>
      <div id="incomePieWrap" style="display:flex;gap:32px;align-items:center;flex-wrap:wrap">
        <canvas id="incomePie" width="220" height="220" style="flex-shrink:0"></canvas>
        <div id="incomeLegend" style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">新增廣告案</div>
    <div class="form-row"><label class="form-label">品牌名稱 / 案名</label><input class="form-input" id="fName" placeholder="例：Nike 夏季廣告"></div>
    <div class="form-grid-3">
      <div><label class="form-label">負責人</label><input class="form-input" id="fOwner" placeholder="例：Zaki"></div>
      <div><label class="form-label">狀態</label><select class="form-select" id="fStatus"><option value="pending">待確認</option><option value="ongoing">執行中</option><option value="invoicing">請款中</option><option value="completed">已結案</option></select></div>
      <div><label class="form-label">年份</label><input class="form-input" id="fYear" type="number" min="2000" max="2099"></div>
    </div>
    <div class="form-grid-2">
      <div><label class="form-label">發案公司</label><input class="form-input" id="fClient" placeholder="例：Nike Taiwan" list="clientList"><datalist id="clientList"></datalist></div>
      <div><label class="form-label">窗口姓名</label><input class="form-input" id="fContact" placeholder="例：陳小姐"></div>
    </div>
    <div class="form-row"><label class="checkbox-label"><input type="checkbox" id="fHasPhoto"><span>此案包含照片拍攝</span></label></div>
    <div class="form-row"><label class="form-label">專案費用（NT$）</label><input class="form-input" id="fFee" type="number" min="0" placeholder="例：80000"></div>
    <div class="form-grid-2">
      <div><label class="form-label">收款狀態</label>
        <select class="form-select" id="fPayStatus" onchange="autoSyncStatus()">
          <option value="unpaid">未送勞報單</option>
          <option value="invoiced">已送勞報單</option>
          <option value="received">已入帳</option>
        </select>
      </div>
      <div><label class="form-label">入帳日期</label>
        <input class="form-input" type="date" id="fPayDate">
      </div>
    </div>
    <div class="form-row"><label class="checkbox-label">
        <input type="checkbox" id="fPublished" onchange="autoSyncPublished()">
        <span>✅ 已上片</span>
      </label></div>
    <div class="form-row"><label class="form-label">備註</label><textarea class="form-textarea" id="fNotes" placeholder="預算、特殊需求、聯絡資訊…"></textarea></div>
    <div class="form-row">
      <div class="ms-form-section-title">影片節點</div>
      <div id="milestonesVideoForm"></div>
      <div id="photoSection" style="display:none">
        <div class="ms-form-section-title" style="margin-top:14px">照片節點</div>
        <div id="milestonesPhotoForm"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveProject()">儲存</button>
    </div>
  </div>
</div>

<div class="export-overlay hidden" id="exportOverlay">
  <div class="export-modal">
    <div class="export-modal-top">
      <div class="export-modal-title">時間節點確認圖</div>
      <button class="export-close" onclick="closeExport()">×</button>
    </div>
    <div class="export-preview"><canvas id="exportCanvas"></canvas></div>
    <div class="export-footer">
      <button class="btn-cancel" onclick="closeExport()">取消</button>
      <button class="btn-save" onclick="downloadExport()">下載圖片</button>
    </div>
  </div>
</div>


<script>
const MILESTONES_VIDEO = [
  { key: 'script_draft', name: '腳本初稿' },
  { key: 'script_final', name: '腳本定案' },
  { key: 'acopy',        name: 'A-Copy'   },
  { key: 'bcopy',        name: 'B-Copy'   },
  { key: 'copy',         name: '文案'     },
  { key: 'release',      name: '上片'     },
];
const MILESTONES_PHOTO = [
  { key: 'photo_acopy',    name: 'A-Copy' },
  { key: 'photo_bcopy',    name: 'B-Copy' },
  { key: 'photo_delivery', name: '交檔'   },
];
const STATUS_LABELS  = { pending:'待確認', ongoing:'執行中', invoicing:'請款中', completed:'已結案' };
const STATUS_CLASSES = { pending:'s-pending', ongoing:'s-ongoing', invoicing:'s-invoicing', completed:'s-completed' };
const MILESTONE_STATUS = { upcoming:'未開始', 'in-progress':'進行中', done:'已完成' };
const PROJ_PALETTE = ['#c0622a','#2563a8','#1e7a44','#a0448a','#b07820','#5040b0','#1878a0','#a83030','#4a8820','#885020'];

function getProjectColor(id) {
  const n = parseInt(String(id).replace(/\D/g,'')) || 0;
  return PROJ_PALETTE[n % PROJ_PALETTE.length];
}
function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── 資料 ──
let projects = [];
let editingId = null;
let currentFilter = 'ongoing';

// ── Vercel + Neon 雲端存取 ──
const API_BASE = '';  // 同網域，Vercel 自動處理

async function loadFromCloud() {
  try {
    const res = await fetch(API_BASE + '/api/projects');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    projects = Array.isArray(data) ? data : [];
    localStorage.setItem('adProjects', JSON.stringify(projects));
  } catch(e) {
    console.warn('雲端載入失敗，使用本地資料:', e.message);
    const local = localStorage.getItem('adProjects');
    if (local) try { projects = JSON.parse(local); } catch(e2) {}
  }
}

async function save() {
  localStorage.setItem('adProjects', JSON.stringify(projects));
  try {
    const res = await fetch(API_BASE + '/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(projects)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  } catch(e) {
    console.warn('雲端儲存失敗:', e.message);
  }
}

// ── 啟動 ──

window.addEventListener('DOMContentLoaded', async () => {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.style.display = 'flex';
  await loadFromCloud().catch(() => {});
  if (overlay) overlay.style.display = 'none';
  initYearSelect();
  render();
});

// ── 頁面切換 ──
function switchPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'clients')  { initYearSelect(); renderClients(); }
  if (name === 'gantt')    { renderGantt(); }
  if (name === 'calendar') { renderCalendar(); }
  if (name === 'income')   { initIncomeDates(); renderIncome(); }
}

function initYearSelect() {
  const sel = document.getElementById('yearSelect');
  const cur = new Date().getFullYear();
  const years = [...new Set(projects.map(p => p.year || cur))].sort((a,b) => b-a);
  if (!years.includes(cur)) years.unshift(cur);
  const prev = sel.value;
  sel.innerHTML = years.map(y => `<option value="${y}"${y==prev?' selected':''}>${y} 年</option>`).join('');
  if (!sel.value) sel.value = cur;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const filtered = currentFilter === 'all' ? projects : projects.filter(p => p.status === currentFilter);
  document.getElementById('countOngoing').textContent  = projects.filter(p=>p.status==='ongoing').length;
  document.getElementById('countDone').textContent     = projects.filter(p=>p.status==='completed').length;
  document.getElementById('countPending').textContent  = projects.filter(p=>p.status==='invoicing').length;
  document.getElementById('countTotal').textContent    = projects.length;

  const grid = document.getElementById('projectsGrid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><span class="empty-icon">—</span><div class="empty-text">目前沒有案子</div></div>`;
    return;
  }
  grid.innerHTML = filtered.map((p, i) => {
    const stLabel = { done:'已完成', 'in-progress':'進行中', upcoming:'未開始' };
    const mkMs = (defs) => defs.map(m => {
      const ms = p.milestones?.[m.key] || {};
      const st = ms.status || 'upcoming';
      return `<div class="ms-row"><span class="ms-dot ${st}"></span><span class="ms-name">${m.name}</span><span class="ms-status ${st}">${stLabel[st]}</span><span class="ms-date${ms.date?'':' empty'}">${ms.date||'—'}</span></div>`;
    }).join('');
    const tags = [
      p.client  ? `<span class="tag tag-client">${escHtml(p.client)}</span>`   : '',
      p.contact ? `<span class="tag tag-contact">${escHtml(p.contact)}</span>` : '',
      p.hasPhoto ? `<span class="tag tag-photo">含照片</span>`                  : '',
    ].filter(Boolean).join('');
    return `<div class="project-card" id="card-${p.id}">
      <div class="card-header" onclick="toggleCard('${p.id}')">
        <div class="card-num">${String(i+1).padStart(2,'0')}</div>
        <div class="card-main">
          <div class="card-title">${escHtml(p.name)}</div>
          <div class="card-meta"><span>負責人：${escHtml(p.owner||'—')}</span><span>建立：${p.created||'—'}</span>${p.fee?`<span style="color:var(--accent);font-weight:700">NT$ ${p.fee.toLocaleString()}</span>`:''}</div>
        </div>
        <span class="status-pill ${STATUS_CLASSES[p.status]}">${STATUS_LABELS[p.status]}</span>
        ${p.published ? `<span class="pay-badge" style="background:#f0fdf4;color:#15803d;border-color:#bbf7d0">已上片</span>` : ''}
      ${p.fee ? `<span class="pay-badge ${{unpaid:'pay-unpaid',invoiced:'pay-invoiced',received:'pay-received'}[p.payStatus||'unpaid']}">${{unpaid:'未送勞報單',invoiced:'已送勞報單',received:'已入帳'}[p.payStatus||'unpaid']}</span>` : ''}
        <span class="card-chevron" id="chv-${p.id}">▾</span>
      </div>
      <div class="card-body" id="body-${p.id}">
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
        <div class="ms-section"><div class="ms-section-label">影片節點</div>${mkMs(MILESTONES_VIDEO)}</div>
        ${p.hasPhoto ? `<div class="ms-section"><div class="ms-section-label">照片節點</div>${mkMs(MILESTONES_PHOTO)}</div>` : ''}
        ${p.notes ? `<div class="card-notes-text">${escHtml(p.notes)}</div>` : ''}
        <div class="card-actions">
          <button class="btn-action edit"   onclick="openEditModal('${p.id}')">✏ 編輯</button>
          <button class="btn-action export" onclick="openExport('${p.id}')">↗ 確認圖</button>
          <button class="btn-action danger" onclick="deleteProject('${p.id}')">✕ 刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  document.getElementById('body-'+id).classList.toggle('open');
  document.getElementById('chv-'+id).classList.toggle('open');
}

function renderClients() {
  const year = parseInt(document.getElementById('yearSelect').value);
  const inYear = projects.filter(p => (p.year || new Date().getFullYear()) == year);
  const container = document.getElementById('clientCards');
  if (!inYear.length) {
    container.innerHTML = `<div class="empty-state"><span class="empty-icon">—</span><div class="empty-text">${year} 年尚無資料</div></div>`;
    return;
  }
  const byClient = {};
  inYear.forEach(p => { const c = p.client||'未填寫'; if (!byClient[c]) byClient[c]=[]; byClient[c].push(p); });
  container.innerHTML = Object.entries(byClient).sort((a,b)=>b[1].length-a[1].length).map(([client, ps]) => {
    const byContact = {};
    ps.forEach(p => { const c = p.contact||'未填寫'; if (!byContact[c]) byContact[c]=[]; byContact[c].push(p); });
    return `<div class="client-card">
      <div class="client-card-top"><div class="client-name">${escHtml(client)}</div><div class="client-count">${ps.length} 件</div></div>
      <div class="contact-items">${Object.entries(byContact).map(([ct,cps])=>`
        <div class="contact-item">
          <div class="contact-item-left"><div class="contact-person">${escHtml(ct)}</div><div class="contact-projs">${cps.map(p=>escHtml(p.name)).join('、')}</div></div>
          <div class="contact-item-count">${cps.length} 件</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function buildMsForm(defs, existing) {
  return defs.map(m => {
    const ms = existing?.[m.key] || {};
    return `<div class="ms-form-row"><span class="ms-form-name">${m.name}</span><input class="ms-date-input" type="date" id="ms_dt_${m.key}" value="${ms.date||''}"></div>`;
  }).join('');
}

function updateClientDatalist() {
  const clients = [...new Set(projects.map(p=>p.client).filter(Boolean))];
  document.getElementById('clientList').innerHTML = clients.map(c=>`<option value="${escHtml(c)}">`).join('');
}

function togglePhotoSection() {
  document.getElementById('photoSection').style.display = document.getElementById('fHasPhoto').checked ? 'block' : 'none';
}

function openModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增廣告案';
  ['fName','fOwner','fClient','fContact','fNotes','fFee','fPayDate'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fPayStatus').value = 'unpaid';
  document.getElementById('fPublished').checked = false;
  document.getElementById('fStatus').value = 'pending';
  document.getElementById('fYear').value = new Date().getFullYear();
  document.getElementById('fHasPhoto').checked = false;
  document.getElementById('photoSection').style.display = 'none';
  document.getElementById('milestonesVideoForm').innerHTML = buildMsForm(MILESTONES_VIDEO, {});
  document.getElementById('milestonesPhotoForm').innerHTML = buildMsForm(MILESTONES_PHOTO, {});
  document.getElementById('fHasPhoto').onchange = togglePhotoSection;
  updateClientDatalist();
  document.getElementById('modal').classList.remove('hidden');
}

function openEditModal(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '編輯廣告案';
  document.getElementById('fName').value    = p.name;
  document.getElementById('fOwner').value   = p.owner   || '';
  document.getElementById('fStatus').value  = p.status;
  document.getElementById('fYear').value    = p.year    || new Date().getFullYear();
  document.getElementById('fClient').value  = p.client  || '';
  document.getElementById('fContact').value = p.contact || '';
  document.getElementById('fHasPhoto').checked = !!p.hasPhoto;
  document.getElementById('fNotes').value   = p.notes   || '';
  document.getElementById('fFee').value       = p.fee != null ? p.fee : '';
  document.getElementById('fPayStatus').value = p.payStatus || 'unpaid';
  document.getElementById('fPublished').checked = !!p.published;
  document.getElementById('fPayDate').value   = p.payDate   || '';
  document.getElementById('photoSection').style.display = p.hasPhoto ? 'block' : 'none';
  document.getElementById('milestonesVideoForm').innerHTML = buildMsForm(MILESTONES_VIDEO, p.milestones||{});
  document.getElementById('milestonesPhotoForm').innerHTML = buildMsForm(MILESTONES_PHOTO, p.milestones||{});
  document.getElementById('fHasPhoto').onchange = togglePhotoSection;
  updateClientDatalist();
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }

async function saveProject() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('請輸入品牌名稱'); return; }
  const today = new Date().toISOString().slice(0,10);
  const milestones = {};
  [...MILESTONES_VIDEO, ...MILESTONES_PHOTO].forEach(m => {
    const el = document.getElementById('ms_dt_' + m.key);
    if (!el) return;
    const date = el.value;
    milestones[m.key] = { status: !date ? 'upcoming' : date <= today ? 'done' : 'upcoming', date };
  });
  const data = {
    name,
    owner:    document.getElementById('fOwner').value.trim(),
    status:   document.getElementById('fStatus').value,
    year:     parseInt(document.getElementById('fYear').value) || new Date().getFullYear(),
    client:   document.getElementById('fClient').value.trim(),
    contact:  document.getElementById('fContact').value.trim(),
    hasPhoto: document.getElementById('fHasPhoto').checked,
    notes:    document.getElementById('fNotes').value.trim(),
    fee:       parseFloat(document.getElementById('fFee').value) || 0,
    published:  document.getElementById('fPublished').checked,
    payStatus: document.getElementById('fPayStatus').value,
    payDate:   document.getElementById('fPayDate').value,
    milestones,
  };
  if (editingId) {
    const idx = projects.findIndex(x => x.id === editingId);
    projects[idx] = { ...projects[idx], ...data };
  } else {
    projects.push({ id: Date.now().toString(), created: new Date().toLocaleDateString('zh-TW'), ...data });
  }
  await save();
  closeModal();
  render();
}

async function deleteProject(id) {
  if (!confirm('確定要刪除這個案子嗎？')) return;
  projects = projects.filter(x => x.id !== id);
  await save();
  render();
}

// ── 甘特圖 ──
let ganttYear = new Date().getFullYear(), ganttMonth = new Date().getMonth();
function ganttPrevMonth() { if(--ganttMonth<0){ganttMonth=11;ganttYear--;} renderGantt(); }
function ganttNextMonth() { if(++ganttMonth>11){ganttMonth=0;ganttYear++;} renderGantt(); }
function ganttGoToday()   { ganttYear=new Date().getFullYear(); ganttMonth=new Date().getMonth(); renderGantt(); }

function renderGantt() {
  const mn = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('ganttMonthLabel').textContent = `${ganttYear} 年 ${mn[ganttMonth]}`;
  const days = new Date(ganttYear, ganttMonth+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];
  const table = document.getElementById('ganttTable');
  let html = '<tr><th style="position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--border);padding:8px 12px;min-width:160px;text-align:left;font-size:0.75rem;color:var(--ink4)">專案</th>';
  for (let d=1; d<=days; d++) {
    const ds = `${ganttYear}-${String(ganttMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(ganttYear, ganttMonth, d).getDay();
    html += `<th class="g-th${ds===todayStr?' today-h':''}${(dow===0||dow===6)?' weekend':''}">${d}</th>`;
  }
  html += '</tr>';
  html += projects.filter(p => p.status !== 'completed').map(p => {
    const col = getProjectColor(p.id);
    let row = `<tr><td class="g-label-td" style="border-left:3px solid ${col}"><div class="g-proj-name">${escHtml(p.name)}</div><div class="g-proj-client">${escHtml(p.client||'')}</div></td>`;
    for (let d=1; d<=days; d++) {
      const ds = `${ganttYear}-${String(ganttMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dow = new Date(ganttYear, ganttMonth, d).getDay();
      const dots = allMs.filter(m => {
        if (!p.milestones?.[m.key]?.date) return false;
        if (!p.hasPhoto && m.key.startsWith('photo_')) return false;
        return p.milestones[m.key].date === ds;
      }).map(m => {
        const st = p.milestones[m.key].status || 'upcoming';
        const bg = st==='done' ? col : st==='in-progress' ? hexToRgba(col,0.5) : '#fff';
        const border = st==='upcoming' ? `border:1px solid ${hexToRgba(col,0.4)}` : '';
        return `<span class="g-dot" style="background:${bg};${border}" onmouseenter="showTip(event,'${escHtml(p.name)} — ${m.name}')" onmouseleave="hideTip()"></span>`;
      }).join('');
      row += `<td class="g-day-td${ds===todayStr?' today-h':''}${(dow===0||dow===6)?' weekend':''}">${dots}</td>`;
    }
    return row + '</tr>';
  }).join('');
  table.innerHTML = html;
}

function showTip(e, text) {
  const t = document.getElementById('ganttTooltip');
  t.textContent = text; t.style.display = 'block';
  t.style.left = (e.clientX+12)+'px'; t.style.top = (e.clientY-28)+'px';
}
function hideTip() { document.getElementById('ganttTooltip').style.display = 'none'; }

// ── 日曆 ──
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
function calPrev()    { if(--calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext()    { if(++calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function calGoToday() { calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); renderCalendar(); }

function renderCalendar() {
  const mn = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonthLabel').textContent = `${calYear} 年 ${mn[calMonth]}`;
  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];
  const todayStr = new Date().toISOString().slice(0,10);
  const evMap = {};
  projects.forEach(p => allMs.forEach(m => {
    if (!p.milestones?.[m.key]?.date) return;
    if (!p.hasPhoto && m.key.startsWith('photo_')) return;
    const dt = p.milestones[m.key].date;
    if (!evMap[dt]) evMap[dt] = [];
    evMap[dt].push({ p, m, status: p.milestones[m.key].status, color: getProjectColor(p.id) });
  }));
  const first = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev  = new Date(calYear, calMonth, 0).getDate();
  const days = ['日','一','二','三','四','五','六'];
  let html = days.map(d=>`<div class="cal-head">${d}</div>`).join('');
  const mkDay = (d, ds, evs, other, isToday) => {
    const isPast = !isToday && ds < todayStr;
    const cls = ['cal-day', other?'other-m':'', evs.length?'has-ev':'', isToday?'is-today':'', isPast?'is-past':''].filter(Boolean).join(' ');
    const chips = evs.slice(0,3).map(ev => {
      const bg = ev.status==='done' ? hexToRgba(ev.color,0.35) : ev.color;
      const nm = ev.p.name.length>9 ? ev.p.name.slice(0,8)+'…' : ev.p.name;
      return `<div class="proj-chip" style="background:${bg}">${escHtml(nm)}</div>`;
    }).join('');
    return `<div class="${cls}" onclick="calClick('${ds}')"><div class="cal-dn">${d}</div>${chips}</div>`;
  };
  for (let i=0; i<first; i++) {
    const d = daysInPrev-first+1+i;
    const pm = calMonth===0?12:calMonth, py = calMonth===0?calYear-1:calYear;
    const ds = `${py}-${String(pm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html += mkDay(d, ds, evMap[ds]||[], true, false);
  }
  for (let d=1; d<=daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html += mkDay(d, ds, evMap[ds]||[], false, ds===todayStr);
  }
  const total = first+daysInMonth, rem = total%7===0?0:7-(total%7);
  for (let d=1; d<=rem; d++) {
    const nm = calMonth===11?1:calMonth+2, ny = calMonth===11?calYear+1:calYear;
    const ds = `${ny}-${String(nm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html += mkDay(d, ds, [], true, false);
  }
  document.getElementById('calGrid').innerHTML = html;
  document.getElementById('calDetail').style.display = 'none';
}

function calClick(ds) {
  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];
  const evs = [];
  projects.forEach(p => allMs.forEach(m => {
    if (!p.milestones?.[m.key]?.date) return;
    if (!p.hasPhoto && m.key.startsWith('photo_')) return;
    if (p.milestones[m.key].date !== ds) return;
    evs.push({ p, m, status: p.milestones[m.key].status });
  }));
  const panel = document.getElementById('calDetail');
  if (!evs.length) { panel.style.display='none'; return; }
  const stLabel = { done:'已完成', 'in-progress':'進行中', upcoming:'未開始' };
  const stClass = { done:'s-completed', 'in-progress':'s-ongoing', upcoming:'s-paused' };
  panel.innerHTML = `<div class="cal-detail-title">📅 ${ds} — ${evs.length} 個節點</div>`
    + evs.map(ev => {
      const col = getProjectColor(ev.p.id);
      return `<div class="cal-ev-row" style="border-left-color:${col}">
        <span class="cal-ev-icon">${ev.m.key.startsWith('photo_')?'📷':'🎬'}</span>
        <span class="cal-ev-proj" style="color:${col}">${escHtml(ev.p.name)}</span>
        <span class="cal-ev-ms">${ev.m.name}</span>
        <span class="cal-ev-badge status-pill ${stClass[ev.status]||'s-paused'}">${stLabel[ev.status]||ev.status}</span>
      </div>`;
    }).join('');
  panel.style.display = 'block';
}

// ── 確認圖 ──
let exportId = null;
function openExport(id) {
  exportId = id;
  const p = projects.find(x=>x.id===id);
  if (!p) return;
  document.getElementById('exportOverlay').classList.remove('hidden');
  drawCanvas(p);
}
function closeExport() { document.getElementById('exportOverlay').classList.add('hidden'); }
function downloadExport() {
  const p = projects.find(x=>x.id===exportId);
  const a = document.createElement('a');
  a.download = `確認圖_${p?.name||'專案'}.png`;
  a.href = document.getElementById('exportCanvas').toDataURL();
  a.click();
}

function drawCanvas(p) {
  const canvas = document.getElementById('exportCanvas');
  const DPR = 2, W = 500;
  const allMs = [...MILESTONES_VIDEO, ...(p.hasPhoto?MILESTONES_PHOTO:[])];
  const items = allMs.map(m => ({
    name: m.name, isPhoto: m.key.startsWith('photo_'),
    date: p.milestones?.[m.key]?.date||'', status: p.milestones?.[m.key]?.status||'upcoming'
  }));
  const PAD=28, ROW=40, H = 110 + items.length*ROW + 50;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  ctx.fillStyle='#fdf6ee'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2c1e0f'; ctx.fillRect(0,0,W,6);
  let y=20;
  ctx.font='800 18px "Noto Sans TC",sans-serif'; ctx.fillStyle='#1e1008';
  ctx.fillText(p.name.length>28?p.name.slice(0,27)+'…':p.name, PAD, y+18); y+=30;
  ctx.font='700 11px "Noto Sans TC",sans-serif';
  let tx=PAD;
  if(p.client){const tw=ctx.measureText(p.client).width;ctx.fillStyle='#2c1e0f';ctx.fillRect(tx,y,tw+16,20);ctx.fillStyle='#fff';ctx.fillText(p.client,tx+8,y+14);tx+=tw+22;}
  if(p.contact){const tw=ctx.measureText(p.contact).width;ctx.fillStyle='#4a2e14';ctx.fillRect(tx,y,tw+16,20);ctx.fillStyle='#fff';ctx.fillText(p.contact,tx+8,y+14);}
  y+=32;
  ctx.strokeStyle='#d9c4aa';ctx.lineWidth=1;ctx.setLineDash([6,3]);
  ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();ctx.setLineDash([]);y+=14;
  ctx.font='700 10px "DM Mono",monospace';ctx.fillStyle='#a07850';
  ctx.fillText('影片節點', PAD, y+10); y+=18;
  items.forEach((m,i)=>{
    if(i%2===0){ctx.fillStyle='#f5ebe0';ctx.fillRect(PAD,y+i*ROW,W-PAD*2,ROW-4);}
    const dx=PAD+8, dy=y+i*ROW+(ROW-4)/2;
    if(m.status==='done'){ctx.fillStyle='#1e7a44';ctx.fillRect(dx,dy-4,8,8);}
    else if(m.status==='in-progress'){ctx.fillStyle='#2563a8';ctx.fillRect(dx,dy-4,8,8);}
    else{ctx.strokeStyle='#d9c4aa';ctx.lineWidth=1.5;ctx.strokeRect(dx,dy-4,8,8);}
    ctx.font='700 13px "Noto Sans TC",sans-serif';ctx.fillStyle='#1e1008';
    ctx.fillText(m.name, PAD+22, y+i*ROW+(ROW-4)/2+5);
    ctx.font='500 11px "DM Mono",monospace';ctx.fillStyle='#4a2e14';
    ctx.textAlign='right';
    ctx.fillText(m.date||'TBD', W-PAD, y+i*ROW+(ROW-4)/2+5);
    ctx.textAlign='left';
  });
  y+=items.length*ROW+8;
  ctx.strokeStyle='#2c1e0f';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();y+=14;
  ctx.font='500 10px "DM Mono",monospace';ctx.fillStyle='#a07850';
  ctx.fillText(new Date().toLocaleDateString('zh-TW'), PAD, y+10);
  ctx.textAlign='right';ctx.fillText('早起上班的 ZAKI', W-PAD, y+10);ctx.textAlign='left';
}


// ── 收入總覽 ──
function initIncomeDates() {
  const now = new Date();
  const fromEl = document.getElementById('incomeFrom');
  const toEl   = document.getElementById('incomeTo');
  if (!fromEl.value) {
    // 預設：本年度第一個月到現在
    fromEl.value = `${now.getFullYear()}-01`;
  }
  if (!toEl.value) {
    toEl.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }
}

function renderIncome() {
  const fromVal = document.getElementById('incomeFrom').value;
  const toVal   = document.getElementById('incomeTo').value;
  if (!fromVal || !toVal) return;

  const from = new Date(fromVal + '-01');
  const to   = new Date(toVal + '-01');
  to.setMonth(to.getMonth() + 1);

  const inRange = projects.filter(p => {
    if (p.status !== 'completed' && p.status !== 'invoicing') return false;
    if (!p.fee || p.fee <= 0) return false;
    let d;
    if (p.year) d = new Date(p.year + '-01-01');
    else if (p.created) d = new Date(p.created.replace(/\//g, '-'));
    else return false;
    return d >= from && d < to;
  });

  const total   = inRange.filter(p => p.payStatus==='received').reduce((s,p) => s+(p.fee||0), 0);
  const pending = inRange.filter(p => p.status==='invoicing' || p.payStatus==='invoiced').reduce((s,p) => s+(p.fee||0), 0);

  document.getElementById('incomeStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">結案總金額</div>
      <div class="stat-value" style="font-size:1.8rem">$${(total/10000).toFixed(1)}<span style="font-size:1rem;font-weight:400">萬</span></div>
      <div class="stat-sub">NT$ ${total.toLocaleString()} · 共 ${inRange.length} 件</div>
    </div>
    <div class="stat-card" style="border-color:#fde68a">
      <div class="stat-label" style="color:#a16207">⏳ 待收</div>
      <div class="stat-value" style="font-size:1.8rem;color:#a16207">$${(pending/10000).toFixed(1)}<span style="font-size:1rem;font-weight:400">萬</span></div>
      <div class="stat-sub">NT$ ${pending.toLocaleString()}</div>
    </div>
  `;

  const byClient = {};
  inRange.forEach(p => {
    const c = p.client || '未填寫客戶';
    if (!byClient[c]) byClient[c] = { total:0, count:0, projs:[] };
    byClient[c].total += p.fee||0;
    byClient[c].count++;
    byClient[c].projs.push(p.name);
  });

  const clientList = Object.entries(byClient).sort((a,b)=>b[1].total-a[1].total);
  const pieWrap = document.getElementById('incomePieWrap');

  if (!clientList.length) {
    pieWrap.innerHTML = '<div style="color:var(--ink4);font-size:0.9rem;padding:20px">此區間沒有收入資料</div>';
    return;
  }

  pieWrap.innerHTML = '<canvas id="incomePie" width="220" height="220" style="flex-shrink:0"></canvas><div id="incomeLegend" style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px"></div>';

  const PIE_COLORS = ['#c0622a','#2563a8','#1e7a44','#a0448a','#b07820','#5040b0','#1878a0','#a83030','#4a8820','#885020'];
  const canvas = document.getElementById('incomePie');
  const ctx = canvas.getContext('2d');
  const cx=110, cy=110, r=95, gap=0.02;
  ctx.clearRect(0,0,220,220);

  let startAngle = -Math.PI/2;
  clientList.forEach(([client, data], i) => {
    const slice = (data.total/total) * (Math.PI*2);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle+gap, startAngle+slice-gap);
    ctx.closePath();
    ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
    ctx.fill();
    const pct = Math.round((data.total/total)*100);
    if (pct >= 6) {
      const mid = startAngle + slice/2;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px "Noto Sans TC",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pct+'%', cx+Math.cos(mid)*r*0.62, cy+Math.sin(mid)*r*0.62);
    }
    startAngle += slice;
  });

  // donut 中心
  ctx.beginPath();
  ctx.arc(cx, cy, r*0.45, 0, Math.PI*2);
  ctx.fillStyle = '#fdf6ee';
  ctx.fill();
  ctx.fillStyle = '#1e1008';
  ctx.font = 'bold 12px "Noto Sans TC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('NT$'+Math.round(total/1000)+'K', cx, cy);

  document.getElementById('incomeLegend').innerHTML = clientList.map(([client, data], i) => {
    const pct = Math.round((data.total/total)*100);
    return '<div style="display:flex;align-items:flex-start;gap:10px">'
      + '<div style="width:12px;height:12px;border-radius:3px;background:'+PIE_COLORS[i%PIE_COLORS.length]+';flex-shrink:0;margin-top:3px"></div>'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-size:0.88rem;font-weight:700;color:var(--ink)">'+escHtml(client)+' <span style="font-weight:400;color:var(--ink4)">'+pct+'%</span></div>'
      + '<div style="font-size:0.75rem;color:var(--ink4)">NT$ '+data.total.toLocaleString()+' · '+data.count+' 件</div>'
      + '<div style="font-size:0.72rem;color:var(--ink4)">'+data.projs.map(n=>escHtml(n)).join('、')+'</div>'
      + '</div></div>';
  }).join('');
}



// ── 已上片自動同步專案狀態 ──
function autoSyncPublished() {
  if (document.getElementById('fPublished').checked) {
    document.getElementById('fStatus').value = 'invoicing';
  }
}

// ── 收款狀態自動同步專案狀態 ──
function autoSyncStatus() {
  const payStatus = document.getElementById('fPayStatus').value;
  const statusEl  = document.getElementById('fStatus');
  if (payStatus === 'invoiced') {
    statusEl.value = 'invoicing';
  } else if (payStatus === 'received') {
    statusEl.value = 'completed';
  }
}
