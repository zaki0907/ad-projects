<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD/PROJ — ZAKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1712;
  --ink2: #3d342b;
  --ink3: #7a6e64;
  --ink4: #b0a89e;
  --paper: #f7f4ef;
  --paper2: #ede9e2;
  --paper3: #e2ddd5;
  --accent: #e8c84a;
  --accent-dark: #c4a520;
  --surface: #ffffff;
  --red: #c0392b;
  --red-bg: #fdf0ee;
  --green: #2c6e49;
  --green-bg: #e8f5ee;
  --blue: #1a5fa8;
  --blue-bg: #e8f0fb;
  --yellow-bg: #fdf7e0;

  --ff-display: 'Fraunces', Georgia, serif;
  --ff-body: 'Instrument Sans', sans-serif;
  --ff-mono: 'DM Mono', monospace;

  --r: 6px;
  --r-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(28,23,18,0.06);
  --shadow: 0 2px 8px rgba(28,23,18,0.10);
  --shadow-lg: 0 8px 32px rgba(28,23,18,0.14);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--ff-body);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ─── NOISE TEXTURE OVERLAY ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1000;
  opacity: 0.5;
}

/* ─── HEADER ─── */
header {
  background: var(--ink);
  color: var(--paper);
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 200;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.logo-main {
  font-family: var(--ff-display);
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.02em;
}
.logo-sub {
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--ink4);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.header-right { display: flex; align-items: center; gap: 10px; }
.btn-logout {
  font-family: var(--ff-body);
  font-size: 12px;
  color: var(--ink4);
  background: transparent;
  border: 1px solid rgba(255,255,255,0.12);
  padding: 5px 14px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.02em;
}
.btn-logout:hover { color: #fff; border-color: rgba(255,255,255,0.35); }

/* ─── NAV ─── */
.nav-bar {
  background: var(--ink);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-bar::-webkit-scrollbar { display: none; }

.nav-tab {
  font-family: var(--ff-body);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--ink3);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 12px 16px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s;
  text-transform: uppercase;
  margin-bottom: -1px;
}
.nav-tab:hover { color: var(--ink4); }
.nav-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ─── LAYOUT ─── */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

@media (max-width: 640px) {
  .container { padding: 20px 16px 48px; }
  header { padding: 0 16px; }
  .nav-bar { padding: 0 12px; }
}

.page { display: none; }
.page.active { display: block; }

/* ─── STATS BAR ─── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
@media (max-width: 640px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); gap: 8px; }
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--paper3);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s;
}
.stat-card:hover { box-shadow: var(--shadow); }
.stat-label {
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--ink4);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.stat-value {
  font-family: var(--ff-display);
  font-size: 32px;
  font-weight: 300;
  color: var(--ink);
  line-height: 1;
  margin-bottom: 2px;
}
.stat-sub { font-size: 11px; color: var(--ink4); }

/* ─── TOOLBAR ─── */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 10px;
  flex-wrap: wrap;
}
.toolbar-left { display: flex; gap: 6px; flex-wrap: wrap; }

.filter-pill {
  font-family: var(--ff-body);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 14px;
  border-radius: 100px;
  border: 1px solid var(--paper3);
  background: var(--surface);
  color: var(--ink3);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}
.filter-pill:hover { border-color: var(--ink4); color: var(--ink2); }
.filter-pill.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--accent);
}

.btn-add {
  font-family: var(--ff-body);
  font-size: 13px;
  font-weight: 600;
  background: var(--accent);
  color: var(--ink);
  border: none;
  padding: 8px 20px;
  border-radius: var(--r);
  cursor: pointer;
  letter-spacing: 0.01em;
  transition: all 0.2s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 0 var(--accent-dark);
}
.btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--accent-dark); }
.btn-add:active { transform: translateY(0); box-shadow: 0 1px 0 var(--accent-dark); }

/* ─── PROJECT CARDS ─── */
.projects-grid { display: flex; flex-direction: column; gap: 8px; }

.project-card {
  background: var(--surface);
  border: 1px solid var(--paper3);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, border-color 0.2s;
}
.project-card:hover { box-shadow: var(--shadow); border-color: var(--paper3); }
.project-card.is-open { border-color: var(--ink); box-shadow: var(--shadow); }

.card-header {
  display: grid;
  grid-template-columns: 36px 1fr auto auto;
  align-items: center;
  padding: 14px 16px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}
@media (max-width: 480px) {
  .card-header { grid-template-columns: 28px 1fr auto auto; gap: 8px; padding: 12px 14px; }
}

.card-num {
  font-family: var(--ff-mono);
  font-size: 11px;
  color: var(--ink4);
  font-weight: 400;
}
.card-main { min-width: 0; }
.card-title {
  font-family: var(--ff-display);
  font-size: 16px;
  font-weight: 400;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
  line-height: 1.3;
}
@media (max-width: 480px) { .card-title { font-size: 14px; } }
.card-meta {
  font-size: 11px;
  color: var(--ink4);
  margin-top: 2px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.status-pill {
  font-family: var(--ff-body);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 100px;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.s-ongoing { background: #dbeafe; color: #1d4ed8; }
.s-completed { background: var(--green-bg); color: var(--green); }
.s-pending { background: var(--yellow-bg); color: #92660a; }
.s-paused { background: var(--paper2); color: var(--ink3); }

.card-chevron {
  color: var(--ink4);
  font-size: 12px;
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  flex-shrink: 0;
  width: 20px;
  text-align: center;
}
.card-chevron.open { transform: rotate(180deg); }

/* ─── CARD BODY ─── */
.card-body {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid var(--paper2);
}
.card-body.open { display: block; }

.card-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-top: 14px;
  margin-bottom: 16px;
}
.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 100px;
  letter-spacing: 0.02em;
}
.tag-client { background: #ede9fe; color: #5b21b6; }
.tag-contact { background: #fee2e2; color: #991b1b; }
.tag-photo { background: var(--yellow-bg); color: #92660a; }

/* ─── MILESTONE GRID ─── */
.ms-section { margin-bottom: 14px; }
.ms-section-label {
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--ink4);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.ms-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-radius: var(--r);
  margin-bottom: 3px;
  border: 1px solid transparent;
  transition: background 0.12s;
}
.ms-row:hover { background: var(--paper); }
.ms-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.ms-dot.done { background: var(--green); }
.ms-dot.in-progress { background: var(--blue); box-shadow: 0 0 0 3px rgba(26,95,168,0.15); }
.ms-dot.upcoming { background: var(--paper3); border: 1px solid var(--paper3); }
.ms-name {
  font-size: 13px;
  color: var(--ink2);
  flex: 1;
}
.ms-status {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 100px;
}
.ms-status.done { background: var(--green-bg); color: var(--green); }
.ms-status.in-progress { background: var(--blue-bg); color: var(--blue); }
.ms-status.upcoming { background: var(--paper2); color: var(--ink4); }
.ms-date {
  font-family: var(--ff-mono);
  font-size: 11px;
  color: var(--ink3);
  min-width: 80px;
  text-align: right;
}
.ms-date.empty { color: var(--paper3); }

@media (max-width: 480px) {
  .ms-date { min-width: 60px; font-size: 10px; }
  .ms-status { display: none; }
}

.card-notes-text {
  font-size: 12px;
  color: var(--ink3);
  background: var(--paper);
  border-radius: var(--r);
  padding: 10px 12px;
  line-height: 1.7;
  white-space: pre-wrap;
  margin-top: 12px;
  border-left: 2px solid var(--paper3);
}

/* ─── CARD ACTIONS ─── */
.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--paper2);
  flex-wrap: wrap;
}
.btn-action {
  font-family: var(--ff-body);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: var(--r);
  border: 1px solid var(--paper3);
  background: var(--surface);
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.01em;
}
.btn-action:hover { background: var(--paper); border-color: var(--ink4); }
.btn-action.primary { background: var(--ink); color: var(--accent); border-color: var(--ink); }
.btn-action.primary:hover { background: var(--ink2); }
.btn-action.danger { color: var(--red); }
.btn-action.danger:hover { background: var(--red-bg); border-color: #f5c0bb; }

/* ─── EMPTY STATE ─── */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--ink4);
}
.empty-icon {
  font-family: var(--ff-display);
  font-size: 48px;
  font-style: italic;
  color: var(--paper3);
  margin-bottom: 12px;
  display: block;
}
.empty-text { font-size: 14px; color: var(--ink4); }

/* ─── GANTT ─── */
.view-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.view-controls .month-label {
  font-family: var(--ff-display);
  font-size: 20px;
  font-weight: 300;
  color: var(--ink);
  min-width: 140px;
  letter-spacing: -0.02em;
}
.btn-nav {
  font-family: var(--ff-mono);
  font-size: 14px;
  width: 32px;
  height: 32px;
  border-radius: var(--r);
  border: 1px solid var(--paper3);
  background: var(--surface);
  color: var(--ink2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.btn-nav:hover { background: var(--paper2); }
.btn-today {
  font-family: var(--ff-body);
  font-size: 11px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: var(--r);
  border: 1px solid var(--paper3);
  background: var(--surface);
  color: var(--ink3);
  cursor: pointer;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.btn-today:hover { background: var(--paper2); }

.gantt-wrap {
  overflow-x: auto;
  background: var(--surface);
  border: 1px solid var(--paper3);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  -webkit-overflow-scrolling: touch;
}
.gantt-table { border-collapse: collapse; width: 100%; min-width: 600px; }
.g-th {
  padding: 8px 0;
  text-align: center;
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--ink4);
  border-bottom: 1px solid var(--paper2);
  font-weight: 400;
}
.g-th.today-h { color: var(--blue); font-weight: 700; }
.g-th.weekend { color: var(--paper3); }
.g-label-td {
  position: sticky;
  left: 0;
  background: var(--surface);
  z-index: 2;
  padding: 7px 14px;
  border-right: 1px solid var(--paper2);
  border-bottom: 1px solid var(--paper2);
  width: 170px;
  min-width: 150px;
  vertical-align: middle;
}
.g-proj-name {
  font-family: var(--ff-display);
  font-size: 12px;
  font-weight: 400;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 150px;
}
.g-proj-client { font-size: 10px; color: var(--ink4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.g-day-td {
  padding: 5px 2px;
  text-align: center;
  border-bottom: 1px solid var(--paper2);
  position: relative;
}
.g-day-td.today-h { background: rgba(26,95,168,0.04); }
.g-day-td.weekend { background: var(--paper); }
.g-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
  cursor: pointer;
  transition: transform 0.12s;
  margin: 1px;
  vertical-align: middle;
}
.g-dot:hover { transform: scale(1.6); }
.g-dot.done { background: var(--green); }
.g-dot.in-progress { background: var(--blue); }
.g-dot.upcoming { background: var(--paper3); }
.g-tooltip {
  position: fixed;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--ff-body);
  font-size: 11px;
  padding: 7px 12px;
  border-radius: var(--r);
  pointer-events: none;
  z-index: 500;
  white-space: nowrap;
  display: none;
  box-shadow: var(--shadow-lg);
  line-height: 1.6;
}

/* ─── CALENDAR ─── */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.cal-head {
  text-align: center;
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--ink4);
  padding: 4px 0 6px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.cal-day {
  background: var(--surface);
  border: 1px solid var(--paper2);
  border-radius: var(--r);
  min-height: 72px;
  padding: 6px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  overflow: hidden;
}
.cal-day:hover { border-color: var(--ink4); }
.cal-day.has-ev { border-color: rgba(26,95,168,0.3); background: #fafcff; }
.cal-day.is-today { border-color: var(--accent); border-width: 2px; }
.cal-day.other-m { background: var(--paper); }
.cal-day.other-m .cal-dn { color: var(--paper3); }
.cal-dn {
  font-family: var(--ff-mono);
  font-size: 11px;
  color: var(--ink3);
  font-weight: 500;
  margin-bottom: 3px;
}
.cal-day.is-today .cal-dn { color: var(--blue); font-weight: 700; }
.cal-ev-chip {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}
.chip-v { background: #dbeafe; color: #1d4ed8; }
.chip-ph { background: var(--yellow-bg); color: #92660a; }
.chip-done { background: var(--green-bg); color: var(--green); }

.cal-detail {
  background: var(--surface);
  border: 1px solid var(--paper3);
  border-radius: var(--r-lg);
  padding: 20px 22px;
  margin-top: 14px;
  box-shadow: var(--shadow-sm);
}
.cal-detail-title {
  font-family: var(--ff-display);
  font-size: 16px;
  font-weight: 300;
  color: var(--ink);
  margin-bottom: 14px;
  letter-spacing: -0.01em;
}
.cal-ev-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--paper);
  border-radius: var(--r);
  margin-bottom: 5px;
  flex-wrap: wrap;
}
.cal-ev-icon { font-size: 13px; flex-shrink: 0; }
.cal-ev-proj { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-ev-ms { font-size: 12px; color: var(--ink3); white-space: nowrap; }
.cal-ev-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 100px; white-space: nowrap; }

@media (max-width: 600px) {
  .cal-day { min-height: 52px; padding: 4px; }
  .cal-ev-chip { display: none; }
  .cal-day.has-ev::after { content: '•'; color: var(--blue); font-size: 14px; display: block; text-align: center; }
}

/* ─── CLIENT STATS ─── */
.section-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.section-controls label {
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--ink4);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.styled-select {
  font-family: var(--ff-body);
  font-size: 13px;
  padding: 6px 12px;
  border: 1px solid var(--paper3);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--ink);
  outline: none;
  cursor: pointer;
}
.client-grid { display: flex; flex-direction: column; gap: 10px; }
.client-card {
  background: var(--surface);
  border: 1px solid var(--paper3);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}
.client-card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 8px;
}
.client-name {
  font-family: var(--ff-display);
  font-size: 18px;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: -0.02em;
}
.client-count {
  font-family: var(--ff-mono);
  font-size: 12px;
  color: var(--ink4);

<body>

<!-- 密碼畫面 -->

<div class="container">

  <!-- 案子列表 -->
  <div class="page active" id="page-projects">
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-label">進行中</div><div class="stat-value" id="countOngoing">0</div><div class="stat-sub">個案子</div></div>
      <div class="stat-card"><div class="stat-label">已結案</div><div class="stat-value" id="countDone">0</div><div class="stat-sub">個案子</div></div>
      <div class="stat-card"><div class="stat-label">待確認</div><div class="stat-value" id="countPending">0</div><div class="stat-sub">個案子</div></div>

<!-- 新增/編輯 Modal -->

        <select class="form-select" id="fStatus">
          <option value="ongoing">進行中</option>
          <option value="pending">待確認</option>
          <option value="paused">暫停</option>
          <option value="completed">已結案</option>
        </select>
      </div>
      <div><label class="form-label">年份</label><input class="form-input" id="fYear" type="number" min="2000" max="2099"></div>
    </div>
    <div class="form-grid-2">
      <div><label class="form-label">發案公司</label><input class="form-input" id="fClient" placeholder="例：Nike Taiwan" list="clientList"><datalist id="clientList"></datalist></div>

    </div>

      <div class="ms-form-section-title">影片節點</div>
      <div id="milestonesVideoForm"></div>
      <div id="photoSection" style="display:none">
        <div class="ms-form-section-title" style="margin-top:14px">照片節點</div>
        <div id="milestonesPhotoForm"></div>
      </div>

    <div class="modal-footer">

      <button class="btn-save" onclick="saveProject()">儲存</button>

    </div>

      <canvas id="exportCanvas"></canvas>
    </div>
    <div class="export-footer">

      <button class="btn-save" onclick="downloadExport()">下載圖片</button>
    </div>

<script>

const PASSWORDS = { owner: 'admin123' };

const MILESTONES_VIDEO = [
  { key: 'script_draft', name: '腳本初稿' },
  { key: 'script_final', name: '腳本定案' },
  { key: 'shooting',     name: '影片拍攝' },
  { key: 'acopy',        name: 'A-Copy'   },
  { key: 'bcopy',        name: 'B-Copy'   },
  { key: 'copy',         name: '文案'     },
  { key: 'release',      name: '上片'     },
];
const MILESTONES_PHOTO = [
  { key: 'photo_acopy',    name: 'A-Copy' },
  { key: 'photo_bcopy',    name: 'B-Copy' },
  { key: 'photo_delivery', name: '交檔'   },
];

const STATUS_LABELS = { ongoing:'進行中', completed:'已結案', pending:'待確認', paused:'暫停' };
const STATUS_CLASSES = { ongoing:'s-ongoing', completed:'s-completed', pending:'s-pending', paused:'s-paused' };
const MILESTONE_STATUS = { upcoming:'未開始', 'in-progress':'進行中', done:'已完成' };

let projects = JSON.parse(localStorage.getItem('adProjects') || '[]');
let currentRole = null;
let editingId = null;
let currentFilter = 'all';

function save() { localStorage.setItem('adProjects', JSON.stringify(projects)); }

// 密碼
function doLogin() {
  const v = document.getElementById('pwInput').value;
  if (v === PASSWORDS.owner) {
    currentRole = 'owner';
    document.getElementById('pwScreen').classList.add('hidden');
    initYearSelect();
    render();
  } else {
    document.getElementById('pwError').textContent = '密碼錯誤，請再試一次';
  }
}
function logout() {
  currentRole = null;
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').textContent = '';
  document.getElementById('pwScreen').classList.remove('hidden');
}

// 頁面切換
function switchPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'clients') { initYearSelect(); renderClients(); }
  if (name === 'gantt') { renderGantt(); }
  if (name === 'calendar') { renderCalendar(); }
}

// 年份選單
function initYearSelect() {
  const sel = document.getElementById('yearSelect');
  const years = [...new Set(projects.map(p => p.year || new Date(p.created||'').getFullYear() || new Date().getFullYear()))].sort((a,b)=>b-a);
  const cur = new Date().getFullYear();
  if (!years.includes(cur)) years.unshift(cur);
  const prev = sel.value;
  sel.innerHTML = years.map(y => `<option value="${y}" ${y==prev?'selected':''}>${y} 年</option>`).join('');
  if (!sel.value) sel.value = cur;
}

// 篩選
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// 渲染案子列表
function render() {
  const filtered = currentFilter === 'all' ? projects : projects.filter(p => p.status === currentFilter);
  document.getElementById('countOngoing').textContent = projects.filter(p=>p.status==='ongoing').length;
  document.getElementById('countDone').textContent = projects.filter(p=>p.status==='completed').length;
  document.getElementById('countPending').textContent = projects.filter(p=>p.status==='pending').length;
  document.getElementById('countTotal').textContent = projects.length;

  const grid = document.getElementById('projectsGrid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><span class="empty-icon">空</span><div class="empty-text">目前沒有符合的案子</div></div>`;
    return;
  }

  grid.innerHTML = filtered.map((p, i) => {
    const icons = { upcoming:'○', 'in-progress':'◑', done:'●' };

    const stLabel = {done:'已完成','in-progress':'進行中',upcoming:'未開始'};
    const videoMs = MILESTONES_VIDEO.map(m => {
      const ms = p.milestones?.[m.key] || {};
      const st = ms.status || 'upcoming';
      return `<div class="ms-row"><span class="ms-dot ${st}"></span><span class="ms-name">${m.name}</span><span class="ms-status ${st}">${stLabel[st]}</span><span class="ms-date ${ms.date?'':'empty'}">${ms.date||'—'}</span></div>`;
    }).join('');

    const photoMs = p.hasPhoto ? MILESTONES_PHOTO.map(m => {
      const ms = p.milestones?.[m.key] || {};
      const st = ms.status || 'upcoming';
      return `<div class="ms-row"><span class="ms-dot ${st}"></span><span class="ms-name">${m.name}</span><span class="ms-status ${st}">${stLabel[st]}</span><span class="ms-date ${ms.date?'':'empty'}">${ms.date||'—'}</span></div>`;
    }).join('') : '';

    const tags = [
      p.client ? `<span class="tag tag-client">${escHtml(p.client)}</span>` : '',
      p.contact ? `<span class="tag tag-contact">${escHtml(p.contact)}</span>` : '',
      p.hasPhoto ? `<span class="tag tag-photo">含照片</span>` : '',
    ].filter(Boolean).join('');

    const notes = escHtml(p.notes||'');

    return `<div class="project-card" id="card-${p.id}">
      <div class="card-header" onclick="toggleCard('${p.id}')">
        <div class="card-num">${String(i+1).padStart(2,'0')}</div>
        <div class="card-main">
          <div class="card-title">${escHtml(p.name)}</div>
          <div class="card-meta">
            <span>負責人：${escHtml(p.owner||'—')}</span>
            <span>建立：${p.created||'—'}</span>
          </div>
        </div>

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 渲染客戶統計
function renderClients() {
  const year = parseInt(document.getElementById('yearSelect').value);
  const inYear = projects.filter(p => (p.year || new Date(p.created||'').getFullYear()) == year);

  const container = document.getElementById('clientCards');
  if (!inYear.length) {
    container.innerHTML = `<div class="empty-state"><span class="empty-icon">空</span><div class="empty-text">${year} 年尚無案子資料</div></div>`;
    return;
  }

  // 以公司分組
  const byClient = {};
  inYear.forEach(p => {
    const c = p.client || '（未填寫公司）';
    if (!byClient[c]) byClient[c] = [];
    byClient[c].push(p);
  });

  // 依案量排序
  const sorted = Object.entries(byClient).sort((a,b) => b[1].length - a[1].length);

  container.innerHTML = sorted.map(([client, ps]) => {
    // 以窗口分組
    const byContact = {};
    ps.forEach(p => {
      const ct = p.contact || '（未填寫窗口）';
      if (!byContact[ct]) byContact[ct] = [];
      byContact[ct].push(p);
    });

    const contactRows = Object.entries(byContact).map(([contact, cps]) =>
      `<div class="contact-item">
        <div class="contact-item-left">
          <div class="contact-person">${escHtml(contact)}</div>
          <div class="contact-projs">${cps.map(p=>escHtml(p.name)).join('、')}</div>
        </div>
        <div class="contact-item-count">${cps.length} 件</div>
      </div>`
    ).join('');

    return `<div class="client-card">
      <div class="client-card-top">
        <div class="client-name">${escHtml(client)}</div>
        <div class="client-count">${ps.length} 件</div>
      </div>
      <div class="contact-items">${contactRows}</div>
    </div>`;
  }).join('');
}

function saveProject() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('請輸入品牌名稱 / 案名'); return; }

  const milestones = {};
  [...MILESTONES_VIDEO, ...MILESTONES_PHOTO].forEach(m => {
    const stEl = document.getElementById('ms_st_'+m.key);
    const dtEl = document.getElementById('ms_dt_'+m.key);
    if (stEl) milestones[m.key] = { status: stEl.value, date: dtEl.value };
  });

  const data = {
    name,
    owner: document.getElementById('fOwner').value.trim(),
    status: document.getElementById('fStatus').value,
    year: parseInt(document.getElementById('fYear').value) || new Date().getFullYear(),
    client: document.getElementById('fClient').value.trim(),
    contact: document.getElementById('fContact').value.trim(),
    hasPhoto: document.getElementById('fHasPhoto').checked,
    notes: document.getElementById('fNotes').value.trim(),
    milestones,
  };

  if (editingId) {
    const idx = projects.findIndex(x=>x.id===editingId);
    projects[idx] = { ...projects[idx], ...data };
  } else {
    projects.push({ id: Date.now().toString(), created: new Date().toLocaleDateString('zh-TW'), ...data });
  }
  save();
  closeModal();
  render();
}

function deleteProject(id) {
  if (!confirm('確定要刪除這個案子嗎？')) return;
  projects = projects.filter(x=>x.id!==id);
  save();
  render();
}

function drawExportCanvas(p) {
  const canvas = document.getElementById('exportCanvas');
  const DPR = 2;
  const W = 500;

  const allMs = [...MILESTONES_VIDEO, ...(p.hasPhoto ? MILESTONES_PHOTO : [])];
  const msWithDate = allMs.map(m => ({
    name: m.name,
    isPhoto: m.key.startsWith('photo_'),
    date: p.milestones?.[m.key]?.date || '',
    status: p.milestones?.[m.key]?.status || 'upcoming',
  }));

  // Layout constants
  const PADDING = 32;
  const HEADER_H = 110;
  const ROW_H = 44;
  const FOOTER_H = 44;
  const SECTION_GAP = 28;
  const videoMs = msWithDate.filter(m => !m.isPhoto);
  const photoMs = msWithDate.filter(m => m.isPhoto);

  let H = HEADER_H + PADDING;
  H += 20 + videoMs.length * ROW_H; // section title + rows
  if (photoMs.length) H += SECTION_GAP + 20 + photoMs.length * ROW_H;
  H += FOOTER_H + PADDING;

  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  // ── Background
  ctx.fillStyle = '#FAFAF8';
  roundRect(ctx, 0, 0, W, H, 12);
  ctx.fill();

  // ── Top accent bar
  ctx.fillStyle = '#2a2420';
  roundRect(ctx, 0, 0, W, 6, 0);
  ctx.fill();

  let y = 24;

  // ── Header area
  // Brand/project name
  ctx.fillStyle = '#2a2420';
  ctx.font = 'bold 18px "Noto Sans TC", sans-serif';
  ctx.fillText(truncate(ctx, p.name, W - PADDING*2), PADDING, y + 18);
  y += 30;

  // Client + contact chips
  if (p.client || p.contact) {
    ctx.font = '12px "Noto Sans TC", sans-serif';
    let cx = PADDING;
    if (p.client) {
      const lbl = '🏢 ' + p.client;
      const tw = ctx.measureText(lbl).width;
      ctx.fillStyle = '#eeedfe';
      roundRect(ctx, cx, y, tw + 18, 22, 11);
      ctx.fill();
      ctx.fillStyle = '#533ab7';
      ctx.fillText(lbl, cx + 9, y + 15);
      cx += tw + 26;
    }
    if (p.contact) {
      const lbl = '👤 ' + p.contact;
      const tw = ctx.measureText(lbl).width;
      ctx.fillStyle = '#faece7';
      roundRect(ctx, cx, y, tw + 18, 22, 11);
      ctx.fill();
      ctx.fillStyle = '#993c1d';
      ctx.fillText(lbl, cx + 9, y + 15);
    }
    y += 34;
  }

  // Divider
  ctx.strokeStyle = '#ddd9d0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PADDING, y);
  ctx.lineTo(W - PADDING, y);
  ctx.stroke();
  y += 18;

  // ── Draw milestone sections
  function drawSection(title, items) {
    // Section title
    ctx.font = '500 11px "DM Mono", monospace';
    ctx.fillStyle = '#9a958e';
    ctx.fillText(title.toUpperCase(), PADDING, y + 11);
    y += 20;

    items.forEach((m, i) => {
      const rowY = y + i * ROW_H;
      const isLast = i === items.length - 1;

      // Row bg (alternating)
      if (i % 2 === 0) {
        ctx.fillStyle = '#f5f3ee';
        roundRect(ctx, PADDING, rowY, W - PADDING*2, ROW_H - 4, 6);
        ctx.fill();
      }

      // Status dot
      const dotX = PADDING + 14;
      const dotY = rowY + ROW_H/2 - 2;
      ctx.beginPath();
      ctx.arc(dotX, dotY, 5, 0, Math.PI*2);
      if (m.status === 'done') ctx.fillStyle = '#2d6a4f';
      else if (m.status === 'in-progress') ctx.fillStyle = '#185fa5';
      else ctx.fillStyle = '#c8c3b8';
      ctx.fill();

      // Milestone name
      ctx.font = '500 13px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#1a1816';
      ctx.fillText(m.name, PADDING + 28, rowY + ROW_H/2 + 5);

      // Date (right-aligned)
      ctx.font = '12px "DM Mono", monospace';
      if (m.date) {
        ctx.fillStyle = '#5a5650';
        ctx.textAlign = 'right';
        ctx.fillText(m.date, W - PADDING, rowY + ROW_H/2 + 5);
      } else {
        ctx.fillStyle = '#c8c3b8';
        ctx.textAlign = 'right';
        ctx.fillText('待定', W - PADDING, rowY + ROW_H/2 + 5);
      }
      ctx.textAlign = 'left';

      // Status label (next to date)
      const stLabel = m.status==='done'?'已完成': m.status==='in-progress'?'進行中':'未開始';
      const stColor = m.status==='done'?'#2d6a4f': m.status==='in-progress'?'#185fa5':'#9a958e';
      const stBg = m.status==='done'?'#d8f3dc': m.status==='in-progress'?'#e6f1fb':'#f1efe8';
      ctx.font = '11px "Noto Sans TC", sans-serif';
      const stW = ctx.measureText(stLabel).width;
      const stX = W - PADDING - (m.date ? ctx.measureText(m.date).width : ctx.measureText('待定').width) - stW - 28;
      ctx.fillStyle = stBg;
      roundRect(ctx, stX, rowY + ROW_H/2 - 9, stW + 14, 18, 9);
      ctx.fill();
      ctx.fillStyle = stColor;
      ctx.fillText(stLabel, stX + 7, rowY + ROW_H/2 + 4);

      // Row separator
      if (!isLast) {
        ctx.strokeStyle = '#e8e4dd';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(PADDING + 24, rowY + ROW_H - 2);
        ctx.lineTo(W - PADDING, rowY + ROW_H - 2);
        ctx.stroke();
      }
    });
    y += items.length * ROW_H + 4;
  }

  drawSection('影片節點', videoMs);
  if (photoMs.length) {
    y += SECTION_GAP - 10;
    ctx.strokeStyle = '#ddd9d0';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PADDING, y - 10); ctx.lineTo(W-PADDING, y-10); ctx.stroke();
    drawSection('照片節點', photoMs);
  }

  // ── Footer
  y += 8;
  ctx.strokeStyle = '#ddd9d0';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PADDING, y); ctx.lineTo(W-PADDING, y); ctx.stroke();
  y += 14;
  ctx.font = '11px "DM Mono", monospace';
  ctx.fillStyle = '#9a958e';
  const today = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
  ctx.fillText('產出日期：' + today, PADDING, y + 10);
  ctx.textAlign = 'right';
  ctx.fillText('早起上班的 ZAKI', W - PADDING, y + 10);
  ctx.textAlign = 'left';
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function truncate(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0,-1);
  return text + '…';
}

// ── 甘特圖 ──
let ganttYear = new Date().getFullYear();
let ganttMonth = new Date().getMonth(); // 0-indexed

function ganttPrevMonth() { ganttMonth--; if(ganttMonth<0){ganttMonth=11;ganttYear--;} renderGantt(); }
function ganttNextMonth() { ganttMonth++; if(ganttMonth>11){ganttMonth=0;ganttYear++;} renderGantt(); }
function ganttGoToday() { ganttYear=new Date().getFullYear(); ganttMonth=new Date().getMonth(); renderGantt(); }

function renderGantt() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('ganttMonthLabel').textContent = ganttYear + ' 年 ' + monthNames[ganttMonth];

  const daysInMonth = new Date(ganttYear, ganttMonth+1, 0).getDate();
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];

  // 只顯示非已結案
  const active = projects.filter(p => p.status !== 'completed' || p.milestones && Object.values(p.milestones).some(m => m.date && m.date.startsWith(ganttYear+'-'+String(ganttMonth+1).padStart(2,'0'))));

  const table = document.getElementById('ganttTable');

  // Header row
  let headerHtml = '<tr><th class="g-th" style="position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--border);padding:8px 12px;text-align:left;width:180px">專案</th>';
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = ganttYear+'-'+String(ganttMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = dateStr === todayStr;
    const dow = new Date(ganttYear, ganttMonth, d).getDay();
    const isWeekend = dow===0||dow===6;
    headerHtml += `<th class="g-th${isToday?' today-col':''}" style="${isWeekend?'color:var(--border2)':''}">${d}</th>`;
  }
  headerHtml += '</tr>';

  // Project rows
  const rowsHtml = projects.map(p => {
    let rowHtml = `<tr><td class="g-label-td"><div class="g-proj-name">${escHtml(p.name)}</div><div class="g-proj-client">${escHtml(p.client||'')}</div></td>`;

    for (let d=1; d<=daysInMonth; d++) {
      const dateStr = ganttYear+'-'+String(ganttMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const isToday = dateStr === todayStr;
      const dow = new Date(ganttYear, ganttMonth, d).getDay();
      const isWeekend = dow===0||dow===6;

      // find milestones on this date
      const dots = allMs.filter(m => {
        if (!p.milestones?.[m.key]) return false;
        if (!p.hasPhoto && (m.key.startsWith('photo_'))) return false;
        return p.milestones[m.key].date === dateStr;
      }).map(m => {
        const st = p.milestones[m.key].status || 'upcoming';
        return `<span class="g-dot ${st}" onmouseenter="showGanttTip(event,'${escHtml(p.name)} — ${m.name} (${st==='done'?'已完成':st==='in-progress'?'進行中':'未開始'})')" onmouseleave="hideGanttTip()"></span>`;
      }).join('');

      rowHtml += `<td class="g-day-td${isToday?' today-col':''}" style="${isWeekend?'background:var(--bg)':''}">${dots}</td>`;
    }
    rowHtml += '</tr>';
    return rowHtml;
  }).join('');

  table.innerHTML = headerHtml + rowsHtml;
}

function showGanttTip(e, text) {
  const tip = document.getElementById('ganttTooltip');
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = (e.clientX+12)+'px';
  tip.style.top = (e.clientY-28)+'px';
}

  document.getElementById('ganttTooltip').style.display = 'none';
}

// ── 日曆視圖 ──
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calSelectedDate = null;

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function calGoToday() { calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); renderCalendar(); }

function renderCalendar() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonthLabel').textContent = calYear + ' 年 ' + monthNames[calMonth];

  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  // 建立日期 → 事件 map
  const evMap = {};
  projects.forEach(p => {
    allMs.forEach(m => {
      if (!p.milestones?.[m.key]) return;
      if (!p.hasPhoto && m.key.startsWith('photo_')) return;
      const date = p.milestones[m.key].date;
      if (!date) return;
      if (!evMap[date]) evMap[date] = [];
      evMap[date].push({ proj: p, ms: m, status: p.milestones[m.key].status });
    });
  });

  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  const days = ['日','一','二','三','四','五','六'];
  let html = days.map(d=>`<div class="cal-day-header">${d}</div>`).join('');

  // prev month padding
  for (let i=0; i<firstDay; i++) {
    const d = daysInPrev - firstDay + 1 + i;
    const pm = calMonth===0?12:calMonth;
    const py = calMonth===0?calYear-1:calYear;
    const ds = py+'-'+String(pm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs = evMap[ds]||[];
    html += buildCalDay(d, ds, evs, true, false);
  }
  // current month
  for (let d=1; d<=daysInMonth; d++) {
    const ds = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs = evMap[ds]||[];
    const isToday = ds===todayStr;
    html += buildCalDay(d, ds, evs, false, isToday);
  }
  // next month padding
  const total = firstDay + daysInMonth;
  const remaining = total%7===0?0:7-(total%7);
  for (let d=1; d<=remaining; d++) {
    const nm = calMonth===11?1:calMonth+2;
    const ny = calMonth===11?calYear+1:calYear;
    const ds = ny+'-'+String(nm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    html += buildCalDay(d, ds, [], true, false);
  }

  document.getElementById('calGrid').innerHTML = html;
  document.getElementById('calDetail').style.display = 'none';
}

function buildCalDay(d, ds, evs, otherMonth, isToday) {
  const classes = ['cal-day', otherMonth?'other-m':'', evs.length?'has-ev':'', isToday?'is-today':''].filter(Boolean).join(' ');
  const dots = evs.slice(0,3).map(ev => {
    const isPhoto = ev.ms.key.startsWith('photo_');
    const cls = ev.status==='done'?'done': isPhoto?'ph':'v';
    return `<div class="cal-ev-chip ${cls==="done"?"chip-done":cls==="ph"?"chip-ph":"chip-v"}">${escHtml(ev.proj.name.length>8?ev.proj.name.slice(0,7)+'…':ev.proj.name)}</div>`;
  }).join('');
  const more = evs.length>3?`<div style="font-size:9px;color:var(--text3)">+${evs.length-3} 更多</div>`:'';
  return `<div class="${classes}" onclick="calSelectDay('${ds}')"><div class="cal-dn">${d}</div>${dots}${more}</div>`;
}

function calSelectDay(ds) {
  calSelectedDate = ds;
  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];
  const evs = [];
  projects.forEach(p => {
    allMs.forEach(m => {
      if (!p.milestones?.[m.key]) return;
      if (!p.hasPhoto && m.key.startsWith('photo_')) return;
      if (p.milestones[m.key].date !== ds) return;
      evs.push({ proj: p, ms: m, status: p.milestones[m.key].status });
    });
  });

  const panel = document.getElementById('calDetail');
  if (!evs.length) { panel.style.display='none'; return; }

  const stLabel = {done:'已完成','in-progress':'進行中',upcoming:'未開始'};
  const stClass = {done:'status-pill s-completed','in-progress':'status-pill s-ongoing',upcoming:'status-pill s-paused'};
  const isPhoto = key => key.startsWith('photo_');

  panel.innerHTML = `<div class="cal-detail-title">📅 ${ds} — 共 ${evs.length} 個節點</div>`
    + evs.map(ev=>`<div class="cal-ev-row">
      <span style="font-size:14px">${isPhoto(ev.ms.key)?'📷':'🎬'}</span>
      <span class="cal-ev-proj">${escHtml(ev.proj.name)}</span>
      <span class="cal-ev-ms">${ev.ms.name}</span>
      <span class="cal-ev-badge status-badge ${stClass[ev.status]||'s-paused'}">${stLabel[ev.status]||ev.status}</span>
    </div>`).join('');
  panel.style.display = 'block';
}
