<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD/PROJ — ZAKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;500;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   8-BIT PIXEL SYSTEM — BLACK / WHITE / GREY
   ══════════════════════════════════════ */
:root {
  /* ── 大地色系 ── */
  --black:  #2c1e0f;   /* 深焦棕，取代純黑 */
  --white:  #fdf6ee;   /* 奶油米白，取代純白 */
  --grey1:  #f5ebe0;   /* 淺沙色 */
  --grey2:  #d9c4aa;   /* 燕麥色 */
  --grey3:  #a07850;   /* 中棕 */
  --grey4:  #5c3d1e;   /* 深棕 */

  --bg:     #f0e4d0;   /* 頁面底色：淺皮革 */
  --surface:#fdf6ee;   /* 卡片底色：奶油 */

  --accent:     #b05c2a;  /* 磚橘紅，主要 accent */
  --accent-bg:  #f5e6db;

  /* project palette */
  --proj-0: #c0622a;
  --proj-1: #5b7fbf;
  --proj-2: #4e9468;
  --proj-3: #b06898;
  --proj-4: #c8882a;
  --proj-5: #7268b8;
  --proj-6: #3d9aaa;
  --proj-7: #b84848;
  --proj-8: #6e9e3c;
  --proj-9: #9e6e30;

  /* action colours */
  --col-edit:      #2c6fc0;
  --col-edit-bg:   #e8f0fb;
  --col-export:    #7040c0;
  --col-export-bg: #f0ebfa;
  --col-del:       #b83030;
  --col-del-bg:    #faeaea;

  /* status colours */
  --col-ongoing:    #2c6fc0;
  --col-ongoing-bg: #e0ecfc;
  --col-done:       #2e7d4f;
  --col-done-bg:    #ddf0e6;
  --col-pending:    #c07820;
  --col-pending-bg: #fdf0d0;
  --col-paused:     #7a6050;
  --col-paused-bg:  #ede5da;

  --ff-pixel: 'Press Start 2P', monospace;
  --ff-body:  'Nunito', 'Zen Maru Gothic', sans-serif;
  --ff-cjk:   'Zen Maru Gothic', 'Nunito', sans-serif;
  --ff-mono:  'DM Mono', monospace;

  --border: 2px solid var(--black);
  --shadow: 4px 4px 0 var(--grey3);
  --shadow-lg: 6px 6px 0 var(--grey3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--ff-cjk);
  background: var(--bg);
  color: var(--black);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: none;
  -moz-osx-font-smoothing: grayscale;
}

/* pixel grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
  background-size: 8px 8px;
  pointer-events: none;
  z-index: 0;
}
.container, header, .nav-bar { position: relative; z-index: 1; }

/* ─── HEADER ─── */
header {
  background: var(--grey4);
  color: var(--white);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 200;
  border-bottom: var(--border);
}

.logo { display: flex; align-items: center; gap: 14px; }
.logo-main {
  font-family: var(--ff-pixel);
  font-size: 13px;
  color: var(--white);
  letter-spacing: 0.04em;
  line-height: 1;
  image-rendering: pixelated;
}
.logo-sub {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 10px;
  color: var(--grey3);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-left: 1px solid var(--grey4);
  padding-left: 14px;
}
.btn-logout {
  font-family: var(--ff-body);
  font-size: 12px;
  color: var(--black);
  background: var(--white);
  border: 2px solid var(--white);
  padding: 7px 14px;
  cursor: pointer;
  transition: all 0.08s;
  letter-spacing: 0.04em;
}
.btn-logout:hover {
  background: var(--grey2);
  border-color: var(--grey2);
  transform: translate(-2px, -2px);
  box-shadow: 2px 2px 0 var(--white);
}

/* ─── NAV ─── */
.nav-bar {
  background: var(--surface);
  border-bottom: var(--border);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  position: sticky;
  top: 56px;
  z-index: 190;
}
.nav-bar::-webkit-scrollbar { display: none; }

.nav-tab {
  font-family: var(--ff-body);
  font-size: 12px;
  color: var(--grey3);
  background: none;
  border: none;
  border-bottom: 4px solid transparent;
  padding: 14px 16px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.08s;
  letter-spacing: 0.06em;
}
.nav-tab:hover { color: var(--grey4); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── LAYOUT ─── */
.container { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }
@media (max-width: 640px) { .container { padding: 16px 14px 60px; } header { padding: 0 14px; } .nav-bar { padding: 0 14px; } }

.page { display: none; }
.page.active { display: block; }

/* ─── STATS BAR ─── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
@media (max-width: 640px) { .stats-bar { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

.stat-card {
  background: var(--surface);
  border: var(--border);
  padding: 16px;
  box-shadow: var(--shadow);
  transition: all 0.08s;
}
.stat-card:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-lg); }

.stat-label {
  font-family: var(--ff-body);
  font-size: 11px;
  color: var(--grey3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.stat-value {
  font-family: var(--ff-pixel);
  font-size: 28px;
  font-weight: 400;
  color: var(--black);
  line-height: 1;
  margin-bottom: 6px;
}
.stat-sub { font-family: var(--ff-body); font-size: 11px; color: var(--grey3); }

/* ─── TOOLBAR ─── */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 10px;
  flex-wrap: wrap;
}
.toolbar-left { display: flex; gap: 6px; flex-wrap: wrap; }

.filter-pill {
  font-family: var(--ff-body);
  font-size: 12px;
  padding: 8px 12px;
  border: var(--border);
  background: var(--white);
  color: var(--grey4);
  cursor: pointer;
  transition: all 0.08s;
  letter-spacing: 0.04em;
}
.filter-pill:hover { background: var(--grey1); transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--black); }
.filter-pill.active { background: var(--accent); border-color: var(--accent); color: var(--white); box-shadow: none; transform: none; }

.btn-add {
  font-family: var(--ff-body);
  font-size: 13px;
  background: var(--black);
  color: var(--white);
  border: var(--border);
  padding: 10px 18px;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.08s;
  box-shadow: var(--shadow);
  white-space: nowrap;
}
.btn-add:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-lg); }
.btn-add:active { transform: translate(2px, 2px); box-shadow: none; }

/* ─── PROJECT CARDS ─── */
.projects-grid { display: flex; flex-direction: column; gap: 10px; }

.project-card {
  background: var(--surface);
  border: var(--border);
  box-shadow: var(--shadow);
  transition: all 0.08s;
}
.project-card:hover { box-shadow: var(--shadow-lg); }
.project-card.is-open { box-shadow: var(--shadow-lg); }

.card-header {
  display: grid;
  grid-template-columns: 40px 1fr auto auto;
  align-items: center;
  padding: 14px 16px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  border-bottom: 2px solid transparent;
  transition: background 0.08s;
}
.card-header:hover { background: var(--grey1); }
.project-card.is-open .card-header { border-bottom: var(--border); background: var(--grey1); }

@media (max-width: 480px) { .card-header { grid-template-columns: 32px 1fr auto auto; gap: 8px; padding: 12px 12px; } }

.card-num {
  font-family: var(--ff-mono);
  font-size: 11px;
  color: var(--grey3);
}
.card-main { min-width: 0; }
.card-title {
  font-family: 'Nunito', sans-serif;
  font-size: 17px;
  font-weight: 900;
  color: var(--black);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
@media (max-width: 480px) { .card-title { font-size: 14px; } }
.card-meta {
  font-family: var(--ff-body);
  font-size: 11px;
  color: var(--grey3);
  margin-top: 3px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* status pills — 黑白反轉 */
.status-pill {
  font-family: var(--ff-body);
  font-size: 11px;
  padding: 5px 10px;
  border: 2px solid var(--black);
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.s-ongoing   { background: var(--col-ongoing-bg);  color: var(--col-ongoing);  border-color: var(--col-ongoing); }
.s-completed { background: var(--col-done-bg);    color: var(--col-done);    border-color: var(--col-done); }
.s-pending   { background: var(--col-pending-bg); color: var(--col-pending); border-color: var(--col-pending); }
.s-paused    { background: var(--col-paused-bg);  color: var(--col-paused);  border-color: var(--col-paused); }

.card-chevron {
  font-family: var(--ff-body);
  font-size: 10px;
  color: var(--grey3);
  transition: transform 0.2s;
  flex-shrink: 0;
  width: 20px;
  text-align: center;
}
.card-chevron.open { transform: rotate(180deg); }

/* ─── CARD BODY ─── */
.card-body { display: none; padding: 16px; }
.card-body.open { display: block; }

.card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tag {
  font-family: var(--ff-body);
  font-size: 11px;
  padding: 5px 10px;
  border: 2px solid var(--black);
  background: var(--white);
  color: var(--black);
  letter-spacing: 0.04em;
}
.tag-client  { background: var(--black); color: var(--white); }
.tag-contact { background: var(--grey4); color: var(--white); border-color: var(--grey4); }
.tag-photo   { background: var(--grey2); color: var(--black); border-color: var(--grey2); }

/* ─── MILESTONE ROWS ─── */
.ms-section { margin-bottom: 16px; }
.ms-section-label {
  font-family: var(--ff-body);
  font-size: 11px;
  color: var(--grey3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px dashed var(--grey2);
}
.ms-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--grey2);
  margin-bottom: 4px;
  background: var(--white);
  transition: background 0.08s;
}
.ms-row:hover { background: var(--grey1); }
.ms-dot {
  width: 10px;
  height: 10px;
  flex-shrink: 0;
}
.ms-dot.done        { background: var(--black); }
.ms-dot.in-progress { background: var(--grey3); outline: 2px solid var(--black); outline-offset: 1px; }
.ms-dot.upcoming    { background: var(--white); border: 2px solid var(--grey2); }
.ms-name {
  font-family: var(--ff-body);
  font-size: 13px;
  font-weight: 500;
  color: var(--black);
  flex: 1;
}
.ms-status { display: none; }
.ms-status.done { display: inline; font-family: var(--ff-body); font-size: 10px; font-weight: 700; padding: 3px 8px; border: 1px solid var(--col-done); background: var(--col-done); color: var(--white); }
.ms-date {
  font-family: var(--ff-mono);
  font-size: 11px;
  color: var(--grey4);
  min-width: 80px;
  text-align: right;
}
.ms-date.empty { color: var(--grey2); }
@media (max-width: 480px) { .ms-date { min-width: 60px; font-size: 10px; } .ms-status { display: none; } }

.card-notes-text {
  font-family: var(--ff-body);
  font-size: 12px;
  color: var(--grey4);
  background: var(--grey1);
  border: 1px dashed var(--grey2);
  padding: 10px 12px;
  line-height: 1.7;
  white-space: pre-wrap;
  margin-top: 12px;
}

/* ─── CARD ACTIONS ─── */
.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 2px dashed var(--grey2);
  flex-wrap: wrap;
}
.btn-action {
  font-family: var(--ff-body);
  font-size: 12px;
  padding: 8px 14px;
  border: var(--border);
  background: var(--white);
  color: var(--black);
  cursor: pointer;
  transition: all 0.08s;
  letter-spacing: 0.04em;
}
.btn-action:hover { background: var(--grey1); transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--black); }
.btn-action:active { transform: translate(1px, 1px); box-shadow: none; }
.btn-action.primary { background: var(--black); color: var(--white); }
.btn-action.primary:hover { background: var(--grey4); }
.btn-action.edit   { color: var(--col-edit);   border-color: var(--col-edit);   background: var(--col-edit-bg); }
.btn-action.edit:hover   { background: #dbeafe; transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--col-edit); }
.btn-action.export { color: var(--col-export); border-color: var(--col-export); background: var(--col-export-bg); }
.btn-action.export:hover { background: #ede9fe; transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--col-export); }
.btn-action.danger { color: var(--col-del);  border-color: var(--col-del);  background: var(--col-del-bg); }
.btn-action.danger:hover { background: #fee2e2; transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--col-del); }

/* ─── EMPTY STATE ─── */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-icon {
  font-family: var(--ff-body);
  font-size: 24px;
  color: var(--grey2);
  margin-bottom: 16px;
  display: block;
  letter-spacing: 0.1em;
}
.empty-text { font-family: var(--ff-body); font-size: 14px; color: var(--grey3); }

/* ─── GANTT ─── */
.view-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.month-label {
  font-family: 'Nunito', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--black);
  min-width: 160px;
  letter-spacing: -0.02em;
}
.btn-nav {
  font-family: var(--ff-body);
  font-size: 12px;
  width: 34px;
  height: 34px;
  border: var(--border);
  background: var(--white);
  color: var(--black);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.08s;
}
.btn-nav:hover { background: var(--grey1); transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--black); }
.btn-today {
  font-family: var(--ff-body);
  font-size: 11px;
  padding: 8px 12px;
  border: var(--border);
  background: var(--white);
  color: var(--grey4);
  cursor: pointer;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: all 0.08s;
}
.btn-today:hover { background: var(--grey1); }

.gantt-wrap {
  overflow-x: auto;
  background: var(--surface);
  border: var(--border);
  box-shadow: var(--shadow);
  -webkit-overflow-scrolling: touch;
}
.gantt-table { border-collapse: collapse; width: 100%; min-width: 600px; }
.g-th {
  padding: 8px 2px;
  text-align: center;
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--grey3);
  border-bottom: var(--border);
  font-weight: 400;
}
.g-th.today-h { color: var(--black); font-weight: 700; background: var(--grey1); }
.g-th.weekend { color: var(--grey2); }
.g-label-td {
  position: sticky; left: 0; z-index: 2;
  background: var(--surface);
  padding: 7px 12px;
  border-right: var(--border);
  border-bottom: 1px solid var(--grey2);
  width: 160px; min-width: 140px;
  vertical-align: middle;
}
.g-proj-name {
  font-family: var(--ff-body);
  font-size: 12px;
  font-weight: 700;
  color: var(--black);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 145px;
}
.g-proj-client { font-family: var(--ff-body); font-size: 10px; color: var(--grey3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 145px; }
.g-day-td {
  padding: 4px 2px;
  text-align: center;
  border-bottom: 1px solid var(--grey2);
}
.g-day-td.today-h { background: var(--grey1); border-left: 2px solid var(--black); border-right: 2px solid var(--black); }
.g-day-td.weekend { background: var(--grey1); }
.g-dot {
  width: 8px; height: 8px;
  display: inline-block;
  cursor: pointer;
  transition: transform 0.08s;
  margin: 1px;
}
.g-dot:hover { transform: scale(1.8); }
.g-dot.done        { background: var(--black); }
.g-dot.in-progress { background: var(--grey3); outline: 1px solid var(--black); }
.g-dot.upcoming    { background: var(--white); border: 1px solid var(--grey2); }
.g-tooltip {
  position: fixed;
  background: var(--black);
  color: var(--white);
  font-family: var(--ff-pixel);
  font-size: 8px;
  padding: 8px 12px;
  pointer-events: none;
  z-index: 500;
  white-space: nowrap;
  display: none;
  border: 2px solid var(--white);
  box-shadow: 4px 4px 0 var(--grey3);
  line-height: 1.8;
}

/* ─── CALENDAR ─── */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-head {
  text-align: center;
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--grey3);
  padding: 6px 0;
  letter-spacing: 0.08em;
}
.cal-day {
  background: var(--surface);
  border: 1px solid var(--grey2);
  min-height: 72px;
  padding: 6px;
  cursor: pointer;
  transition: all 0.08s;
  overflow: hidden;
}
.cal-day:hover { border-color: var(--black); background: var(--grey1); }
.cal-day.has-ev { border: 2px solid var(--black); }
.cal-day.is-today { border: 2px solid var(--accent); background: var(--accent); }
.cal-day.is-today .cal-dn { color: var(--white); }
.cal-day.other-m { background: var(--grey1); }
.cal-day.other-m .cal-dn { color: var(--grey2); }

/* project colour chips in calendar */
.proj-chip { font-family: var(--ff-body); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; border-left: 3px solid rgba(0,0,0,0.15); }
.cal-ev-chip {
  font-family: var(--ff-body);
  font-size: 9px;
  padding: 1px 4px;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
  border-left: 2px solid;
  padding-left: 4px;
}
.chip-v    { color: var(--black); border-color: var(--black); background: var(--grey1); }
.chip-ph   { color: var(--grey4); border-color: var(--grey4); background: var(--grey1); }
.chip-done { color: var(--grey3); border-color: var(--grey3); background: var(--white); }

.cal-detail {
  background: var(--surface);
  border: var(--border);
  box-shadow: var(--shadow);
  padding: 20px 22px;
  margin-top: 12px;
}
.cal-detail-title {
  font-family: 'Nunito', sans-serif;
  font-size: 18px;
  font-weight: 900;
  color: var(--black);
  margin-bottom: 14px;
  letter-spacing: -0.01em;
  border-bottom: var(--border);
  padding-bottom: 10px;
}
.cal-ev-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--grey1);
  border: 1px solid var(--grey2);
  margin-bottom: 5px;
  flex-wrap: wrap;
}
.cal-ev-proj { font-family: var(--ff-body); font-weight: 700; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-ev-ms { font-family: var(--ff-body); font-size: 12px; color: var(--grey3); white-space: nowrap; }

@media (max-width: 600px) {
  .cal-day { min-height: 52px; padding: 4px; }

<script>


const PASSWORDS = { owner: 'admin123' };

// ── 專案配色 ──
const PROJ_PALETTE = [
  '#e07b54','#5b8dd9','#52a882','#c97bb2','#e0a030',
  '#7b7fd4','#4fb3c8','#d45f5f','#85b35c','#b07d4a'
];
function getProjectColor(projId) {
  // 用 id 的數字取模，讓每個專案有固定顏色
  const num = parseInt(projId.replace(/\D/g,'')) || 0;
  return PROJ_PALETTE[num % PROJ_PALETTE.length];
}
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}


const MILESTONES_VIDEO = [
  { key: 'script_draft', name: '腳本初稿' },
  { key: 'script_final', name: '腳本定案' },
  { key: 'acopy',        name: 'A-Copy'   },
  { key: 'bcopy',        name: 'B-Copy'   },
  { key: 'copy',         name: '文案'     },
  { key: 'release',      name: '上片'     },
];
const MILESTONES_PHOTO = [
  { key: 'photo_acopy',    name: 'A-Copy' },
  { key: 'photo_bcopy',    name: 'B-Copy' },
  { key: 'photo_delivery', name: '交檔'   },
];

const STATUS_LABELS = { ongoing:'進行中', completed:'已結案', pending:'待確認', paused:'暫停' };
const STATUS_CLASSES = { ongoing:'s-ongoing', completed:'s-completed', pending:'s-pending', paused:'s-paused' };
const MILESTONE_STATUS = { upcoming:'未開始', 'in-progress':'進行中', done:'已完成' };

let projects = JSON.parse(localStorage.getItem('adProjects') || '[]');
let currentRole = null;
let editingId = null;
let currentFilter = 'all';

function save() { localStorage.setItem('adProjects', JSON.stringify(projects)); }

// 密碼
function doLogin() {
  const v = document.getElementById('pwInput').value;
  if (v === PASSWORDS.owner) {
    currentRole = 'owner';
    document.getElementById('pwScreen').classList.add('hidden');
    initYearSelect();
    render();
  } else {
    document.getElementById('pwError').textContent = '密碼錯誤，請再試一次';
  }
}
function logout() {
  currentRole = null;
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').textContent = '';
  document.getElementById('pwScreen').classList.remove('hidden');
}

// 頁面切換
function switchPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'clients') { initYearSelect(); renderClients(); }
  if (name === 'gantt') { renderGantt(); }
  if (name === 'calendar') { renderCalendar(); }
}

// 年份選單
function initYearSelect() {
  const sel = document.getElementById('yearSelect');
  const years = [...new Set(projects.map(p => p.year || new Date(p.created||'').getFullYear() || new Date().getFullYear()))].sort((a,b)=>b-a);
  const cur = new Date().getFullYear();
  if (!years.includes(cur)) years.unshift(cur);
  const prev = sel.value;
  sel.innerHTML = years.map(y => `<option value="${y}" ${y==prev?'selected':''}>${y} 年</option>`).join('');
  if (!sel.value) sel.value = cur;
}

// 篩選
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// 渲染案子列表
function render() {
  const filtered = currentFilter === 'all' ? projects : projects.filter(p => p.status === currentFilter);
  document.getElementById('countOngoing').textContent = projects.filter(p=>p.status==='ongoing').length;
  document.getElementById('countDone').textContent = projects.filter(p=>p.status==='completed').length;
  document.getElementById('countPending').textContent = projects.filter(p=>p.status==='pending').length;
  document.getElementById('countTotal').textContent = projects.length;

  const grid = document.getElementById('projectsGrid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><span class="empty-icon">空</span><div class="empty-text">目前沒有符合的案子</div></div>`;
    return;
  }

  grid.innerHTML = filtered.map((p, i) => {
    const icons = { upcoming:'○', 'in-progress':'◑', done:'●' };

    const stLabel = {done:'已完成','in-progress':'進行中',upcoming:'未開始'};
    const videoMs = MILESTONES_VIDEO.map(m => {
      const ms = p.milestones?.[m.key] || {};
      const st = ms.status || 'upcoming';
      return `<div class="ms-row"><span class="ms-dot ${st}"></span><span class="ms-name">${m.name}</span><span class="ms-status ${st}">${stLabel[st]}</span><span class="ms-date ${ms.date?'':'empty'}">${ms.date||'—'}</span></div>`;
    }).join('');

    const photoMs = p.hasPhoto ? MILESTONES_PHOTO.map(m => {
      const ms = p.milestones?.[m.key] || {};
      const st = ms.status || 'upcoming';
      return `<div class="ms-row"><span class="ms-dot ${st}"></span><span class="ms-name">${m.name}</span><span class="ms-status ${st}">${stLabel[st]}</span><span class="ms-date ${ms.date?'':'empty'}">${ms.date||'—'}</span></div>`;
    }).join('') : '';

    const tags = [
      p.client ? `<span class="tag tag-client">${escHtml(p.client)}</span>` : '',
      p.contact ? `<span class="tag tag-contact">${escHtml(p.contact)}</span>` : '',
      p.hasPhoto ? `<span class="tag tag-photo">含照片</span>` : '',
    ].filter(Boolean).join('');

    const notes = escHtml(p.notes||'');

    return `<div class="project-card" id="card-${p.id}">
      <div class="card-header" onclick="toggleCard('${p.id}')">
        <div class="card-num">${String(i+1).padStart(2,'0')}</div>
        <div class="card-main">
          <div class="card-title">${escHtml(p.name)}</div>
          <div class="card-meta">
            <span>負責人：${escHtml(p.owner||'—')}</span>
            <span>建立：${p.created||'—'}</span>
          </div>
        </div>
        <span class="status-pill ${STATUS_CLASSES[p.status]}">${STATUS_LABELS[p.status]}</span>
        <span class="card-toggle" id="toggle-${p.id}">▾</span>
      </div>
      <div class="card-body" id="body-${p.id}">
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
        <div class="ms-section">
          <div class="ms-section-label">影片節點</div>
          ${videoMs}
        </div>
        ${p.hasPhoto ? `<div class="ms-section"><div class="ms-section-label">照片節點</div>${photoMs}</div>` : ''}
        ${notes ? `<div class="card-notes-text">${notes.replace(/<div class="card-notes-text">/,'').replace(/<\/div>/,'')}</div>` : ''}
        <div class="card-actions">
          <button class="btn-action edit" onclick="openEditModal('${p.id}')">✏ 編輯</button>
          <button class="btn-action export" onclick="openExport('${p.id}')">↗ 確認圖</button>
          <button class="btn-action danger" onclick="deleteProject('${p.id}')">✕ 刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  document.getElementById('body-'+id).classList.toggle('open');
  document.getElementById('toggle-'+id).classList.toggle('open');
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 渲染客戶統計
function renderClients() {
  const year = parseInt(document.getElementById('yearSelect').value);
  const inYear = projects.filter(p => (p.year || new Date(p.created||'').getFullYear()) == year);

  const container = document.getElementById('clientCards');
  if (!inYear.length) {
    container.innerHTML = `<div class="empty-state"><span class="empty-icon">空</span><div class="empty-text">${year} 年尚無案子資料</div></div>`;
    return;
  }

  // 以公司分組
  const byClient = {};
  inYear.forEach(p => {
    const c = p.client || '（未填寫公司）';
    if (!byClient[c]) byClient[c] = [];
    byClient[c].push(p);
  });

  // 依案量排序
  const sorted = Object.entries(byClient).sort((a,b) => b[1].length - a[1].length);

  container.innerHTML = sorted.map(([client, ps]) => {
    // 以窗口分組
    const byContact = {};
    ps.forEach(p => {
      const ct = p.contact || '（未填寫窗口）';
      if (!byContact[ct]) byContact[ct] = [];
      byContact[ct].push(p);
    });

    const contactRows = Object.entries(byContact).map(([contact, cps]) =>
      `<div class="contact-item">
        <div class="contact-item-left">
          <div class="contact-person">${escHtml(contact)}</div>
          <div class="contact-projs">${cps.map(p=>escHtml(p.name)).join('、')}</div>
        </div>
        <div class="contact-item-count">${cps.length} 件</div>
      </div>`
    ).join('');

    return `<div class="client-card">
      <div class="client-card-top">
        <div class="client-name">${escHtml(client)}</div>
        <div class="client-count">${ps.length} 件</div>
      </div>
      <div class="contact-items">${contactRows}</div>
    </div>`;
  }).join('');
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }

function saveProject() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('請輸入品牌名稱 / 案名'); return; }

  const milestones = {};
  const today = new Date().toISOString().slice(0,10);
  [...MILESTONES_VIDEO, ...MILESTONES_PHOTO].forEach(m => {
    const dtEl = document.getElementById('ms_dt_'+m.key);
    if (!dtEl) return;
    const date = dtEl.value;
    const status = !date ? 'upcoming' : date <= today ? 'done' : 'upcoming';
    milestones[m.key] = { status, date };
  });

  const data = {
    name,
    owner: document.getElementById('fOwner').value.trim(),
    status: document.getElementById('fStatus').value,
    year: parseInt(document.getElementById('fYear').value) || new Date().getFullYear(),
    client: document.getElementById('fClient').value.trim(),
    contact: document.getElementById('fContact').value.trim(),
    hasPhoto: document.getElementById('fHasPhoto').checked,
    notes: document.getElementById('fNotes').value.trim(),
    milestones,
  };

  if (editingId) {
    const idx = projects.findIndex(x=>x.id===editingId);
    projects[idx] = { ...projects[idx], ...data };
  } else {
    projects.push({ id: Date.now().toString(), created: new Date().toLocaleDateString('zh-TW'), ...data });
  }
  save();
  closeModal();
  render();
}

function deleteProject(id) {
  if (!confirm('確定要刪除這個案子嗎？')) return;
  projects = projects.filter(x=>x.id!==id);
  save();
  render();
}

function drawExportCanvas(p) {
  const canvas = document.getElementById('exportCanvas');
  const DPR = 2;
  const W = 500;
  const allMs = [...MILESTONES_VIDEO, ...(p.hasPhoto ? MILESTONES_PHOTO : [])];
  const msData = allMs.map(m => ({
    name: m.name, isPhoto: m.key.startsWith('photo_'),
    date: p.milestones?.[m.key]?.date || '',
    status: p.milestones?.[m.key]?.status || 'upcoming',
  }));
  const videoMs = msData.filter(m => !m.isPhoto);
  const photoMs = msData.filter(m => m.isPhoto);
  const PADDING = 28;
  const ROW_H = 40;
  const HEADER_H = 100;
  let H = HEADER_H + PADDING;
  H += 20 + videoMs.length * ROW_H;
  if (photoMs.length) H += 32 + 20 + photoMs.length * ROW_H;
  H += 50 + PADDING;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  ctx.imageSmoothingEnabled = false;

  // BG
  ctx.fillStyle = '#fdf6ee';
  ctx.fillRect(0, 0, W, H);

  // pixel grid
  ctx.strokeStyle = 'rgba(100,60,20,0.06)';
  ctx.lineWidth = 0.5;
  for (let gx = 0; gx < W; gx += 8) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for (let gy = 0; gy < H; gy += 8) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

  // top border bar (pixel dashes)
  ctx.fillStyle = '#000000';
  for (let x = 0; x < W; x += 16) ctx.fillRect(x, 0, 8, 6);

  let y = 20;

  // Project title
  ctx.fillStyle = '#000000';
  ctx.font = '800 18px "Nunito", sans-serif';
  ctx.fillText(truncate(ctx, p.name, W - PADDING*2), PADDING, y + 18);
  y += 28;

  // tags
  ctx.font = '700 11px "Nunito", sans-serif';
  let tx = PADDING;
  if (p.client) {
    const lbl = p.client;
    const tw = ctx.measureText(lbl).width;
    ctx.fillStyle = '#000000';
    ctx.fillRect(tx, y, tw + 16, 20);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(lbl, tx + 8, y + 14);
    tx += tw + 22;
  }
  if (p.contact) {
    const lbl = p.contact;
    const tw = ctx.measureText(lbl).width;
    ctx.fillStyle = '#444444';
    ctx.fillRect(tx, y, tw + 16, 20);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(lbl, tx + 8, y + 14);
  }
  y += 30;

  // divider (dashed)
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 4]);
  ctx.beginPath(); ctx.moveTo(PADDING, y); ctx.lineTo(W - PADDING, y); ctx.stroke();
  ctx.setLineDash([]);
  y += 16;

  function drawSection(title, items) {
    // section title
    ctx.font = '700 10px "DM Mono", monospace';
    ctx.fillStyle = '#888888';
    ctx.fillText(title.toUpperCase(), PADDING, y + 10);
    y += 20;

    items.forEach((m, i) => {
      const rowY = y + i * ROW_H;
      // alternating row bg
      if (i % 2 === 0) { ctx.fillStyle = '#f2f2f2'; ctx.fillRect(PADDING, rowY, W - PADDING*2, ROW_H - 4); }

      // dot
      const dotSize = 8;
      const dotX = PADDING + 8;
      const dotY = rowY + (ROW_H - 4)/2 - dotSize/2;
      if (m.status === 'done') {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(dotX, dotY, dotSize, dotSize);
      } else if (m.status === 'in-progress') {
        ctx.fillStyle = '#888888';
        ctx.fillRect(dotX, dotY, dotSize, dotSize);
        ctx.strokeStyle = '#000000'; ctx.lineWidth = 1;
        ctx.strokeRect(dotX - 2, dotY - 2, dotSize + 4, dotSize + 4);
      } else {
        ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 1.5;
        ctx.strokeRect(dotX, dotY, dotSize, dotSize);
      }

      // name
      ctx.font = '700 13px "Nunito", sans-serif';
      ctx.fillStyle = '#000000';
      ctx.fillText(m.name, PADDING + 24, rowY + ROW_H/2 + 4);

      // status badge
      const stLabel = m.status==='done'?'已完成': m.status==='in-progress'?'進行中':'未開始';
      ctx.font = '800 9px "Nunito", sans-serif';
      const sw = ctx.measureText(stLabel).width;
      const badgeBg = m.status==='done'?'#000000': m.status==='in-progress'?'#444444':'#ffffff';
      const badgeFg = m.status==='upcoming'?'#888888':'#ffffff';
      const badgeBorder = m.status==='upcoming'?'#cccccc':badgeBg;
      const bx = W - PADDING - (m.date ? ctx.measureText(m.date).width + 16 : 12) - sw - 22;
      ctx.fillStyle = badgeBg;
      ctx.fillRect(bx, rowY + ROW_H/2 - 9, sw + 14, 17);
      if (m.status === 'upcoming') { ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 1; ctx.strokeRect(bx, rowY + ROW_H/2 - 9, sw + 14, 17); }
      ctx.fillStyle = badgeFg;
      ctx.fillText(stLabel, bx + 7, rowY + ROW_H/2 + 4);

      // date
      ctx.font = '500 11px "DM Mono", monospace';
      ctx.textAlign = 'right';
      if (m.date) { ctx.fillStyle = '#444444'; ctx.fillText(m.date, W - PADDING, rowY + ROW_H/2 + 4); }
      else { ctx.fillStyle = '#cccccc'; ctx.fillText('TBD', W - PADDING, rowY + ROW_H/2 + 4); }
      ctx.textAlign = 'left';

      // row divider
      if (i < items.length - 1) {
        ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 0.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(PADDING + 20, rowY + ROW_H - 2); ctx.lineTo(W - PADDING, rowY + ROW_H - 2); ctx.stroke();
      }
    });
    y += items.length * ROW_H + 4;
  }

  drawSection('影片節點', videoMs);
  if (photoMs.length) {
    y += 10;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.setLineDash([8,4]);
    ctx.beginPath(); ctx.moveTo(PADDING, y); ctx.lineTo(W-PADDING, y); ctx.stroke();
    ctx.setLineDash([]); y += 18;
    drawSection('照片節點', photoMs);
  }

  // footer
  y += 8;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(PADDING, y); ctx.lineTo(W-PADDING, y); ctx.stroke();
  y += 14;
  ctx.font = '500 10px "DM Mono", monospace';
  ctx.fillStyle = '#888888';
  const today = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
  ctx.fillText(today, PADDING, y + 10);
  ctx.textAlign = 'right';
  ctx.fillText('早起上班的 ZAKI', W - PADDING, y + 10);
  ctx.textAlign = 'left';

  // bottom pixel dashes
  ctx.fillStyle = '#000000';
  for (let x = 0; x < W; x += 16) ctx.fillRect(x, H - 6, 8, 6);
}


function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function truncate(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0,-1);
  return text + '…';
}

// ── 甘特圖 ──
let ganttYear = new Date().getFullYear();
let ganttMonth = new Date().getMonth(); // 0-indexed

function ganttPrevMonth() { ganttMonth--; if(ganttMonth<0){ganttMonth=11;ganttYear--;} renderGantt(); }
function ganttNextMonth() { ganttMonth++; if(ganttMonth>11){ganttMonth=0;ganttYear++;} renderGantt(); }
function ganttGoToday() { ganttYear=new Date().getFullYear(); ganttMonth=new Date().getMonth(); renderGantt(); }

function renderGantt() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('ganttMonthLabel').textContent = ganttYear + ' 年 ' + monthNames[ganttMonth];

  const daysInMonth = new Date(ganttYear, ganttMonth+1, 0).getDate();
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];

  // 只顯示非已結案
  const active = projects.filter(p => p.status !== 'completed' || p.milestones && Object.values(p.milestones).some(m => m.date && m.date.startsWith(ganttYear+'-'+String(ganttMonth+1).padStart(2,'0'))));

  const table = document.getElementById('ganttTable');

  // Header row
  let headerHtml = '<tr><th class="g-th" style="position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--border);padding:8px 12px;text-align:left;width:180px">專案</th>';
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = ganttYear+'-'+String(ganttMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = dateStr === todayStr;
    const dow = new Date(ganttYear, ganttMonth, d).getDay();
    const isWeekend = dow===0||dow===6;
    headerHtml += `<th class="g-th${isToday?' today-col':''}" style="${isWeekend?'color:var(--border2)':''}">${d}</th>`;
  }
  headerHtml += '</tr>';

  // Project rows
  const rowsHtml = projects.map(p => {
    const gCol = getProjectColor(p.id);
    let rowHtml = `<tr><td class="g-label-td" style="border-left:4px solid ${gCol}"><div class="g-proj-name">${escHtml(p.name)}</div><div class="g-proj-client">${escHtml(p.client||'')}</div></td>`;

    for (let d=1; d<=daysInMonth; d++) {
      const dateStr = ganttYear+'-'+String(ganttMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const isToday = dateStr === todayStr;
      const dow = new Date(ganttYear, ganttMonth, d).getDay();
      const isWeekend = dow===0||dow===6;

      // find milestones on this date
      const projCol = getProjectColor(p.id);
      const dots = allMs.filter(m => {
        if (!p.milestones?.[m.key]) return false;
        if (!p.hasPhoto && (m.key.startsWith('photo_'))) return false;
        return p.milestones[m.key].date === dateStr;
      }).map(m => {
        const st = p.milestones[m.key].status || 'upcoming';
        const dotStyle = st==='done'
          ? `background:${projCol}`
          : st==='in-progress'
          ? `background:${hexToRgba(projCol,0.5)};outline:2px solid ${projCol};outline-offset:1px`
          : `background:white;border:2px solid ${hexToRgba(projCol,0.4)}`;
        return `<span class="g-dot" style="${dotStyle}" onmouseenter="showGanttTip(event,'${escHtml(p.name)} — ${m.name}')" onmouseleave="hideGanttTip()"></span>`;
      }).join('');

      rowHtml += `<td class="g-day-td${isToday?' today-col':''}" style="${isWeekend?'background:var(--bg)':''}">${dots}</td>`;
    }
    rowHtml += '</tr>';
    return rowHtml;
  }).join('');

  table.innerHTML = headerHtml + rowsHtml;
}

function showGanttTip(e, text) {
  const tip = document.getElementById('ganttTooltip');
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = (e.clientX+12)+'px';
  tip.style.top = (e.clientY-28)+'px';
}
function hideGanttTip() {
  document.getElementById('ganttTooltip').style.display = 'none';
}

// ── 日曆視圖 ──
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calSelectedDate = null;

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function calGoToday() { calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); renderCalendar(); }

function renderCalendar() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonthLabel').textContent = calYear + ' 年 ' + monthNames[calMonth];

  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  // 建立日期 → 事件 map
  const evMap = {};
  projects.forEach(p => {
    allMs.forEach(m => {
      if (!p.milestones?.[m.key]) return;
      if (!p.hasPhoto && m.key.startsWith('photo_')) return;
      const date = p.milestones[m.key].date;
      if (!date) return;
      if (!evMap[date]) evMap[date] = [];
      evMap[date].push({ proj: p, ms: m, status: p.milestones[m.key].status, color: getProjectColor(p.id) });
    });
  });

  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  const days = ['日','一','二','三','四','五','六'];
  let html = days.map(d=>`<div class="cal-day-header">${d}</div>`).join('');

  // prev month padding
  for (let i=0; i<firstDay; i++) {
    const d = daysInPrev - firstDay + 1 + i;
    const pm = calMonth===0?12:calMonth;
    const py = calMonth===0?calYear-1:calYear;
    const ds = py+'-'+String(pm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs = evMap[ds]||[];
    html += buildCalDay(d, ds, evs, true, false);
  }
  // current month
  for (let d=1; d<=daysInMonth; d++) {
    const ds = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs = evMap[ds]||[];
    const isToday = ds===todayStr;
    html += buildCalDay(d, ds, evs, false, isToday);
  }
  // next month padding
  const total = firstDay + daysInMonth;
  const remaining = total%7===0?0:7-(total%7);
  for (let d=1; d<=remaining; d++) {
    const nm = calMonth===11?1:calMonth+2;
    const ny = calMonth===11?calYear+1:calYear;
    const ds = ny+'-'+String(nm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    html += buildCalDay(d, ds, [], true, false);
  }

  document.getElementById('calGrid').innerHTML = html;
  document.getElementById('calDetail').style.display = 'none';
}

function buildCalDay(d, ds, evs, otherMonth, isToday) {
  const classes = ['cal-day', otherMonth?'other-m':'', evs.length?'has-ev':'', isToday?'is-today':''].filter(Boolean).join(' ');
  const dots = evs.slice(0,3).map(ev => {
    const isPhoto = ev.ms.key.startsWith('photo_');
    const cls = ev.status==='done'?'done': isPhoto?'ph':'v';
    return `<div class="cal-ev-chip ${cls==="done"?"chip-done":cls==="ph"?"chip-ph":"chip-v"}">${escHtml(ev.proj.name.length>8?ev.proj.name.slice(0,7)+'…':ev.proj.name)}</div>`;
  }).join('');
  const more = evs.length>3?`<div style="font-size:9px;color:var(--text3)">+${evs.length-3} 更多</div>`:'';
  return `<div class="${classes}" onclick="calSelectDay('${ds}')"><div class="cal-dn">${d}</div>${dots}${more}</div>`;
}

function calSelectDay(ds) {
  calSelectedDate = ds;
  const allMs = [...MILESTONES_VIDEO, ...MILESTONES_PHOTO];
  const evs = [];
  projects.forEach(p => {
    allMs.forEach(m => {
      if (!p.milestones?.[m.key]) return;
      if (!p.hasPhoto && m.key.startsWith('photo_')) return;
      if (p.milestones[m.key].date !== ds) return;
      evs.push({ proj: p, ms: m, status: p.milestones[m.key].status });
    });
  });

  const panel = document.getElementById('calDetail');
  if (!evs.length) { panel.style.display='none'; return; }

  const stLabel = {done:'已完成','in-progress':'進行中',upcoming:'未開始'};
  const stClass = {done:'status-pill s-completed','in-progress':'status-pill s-ongoing',upcoming:'status-pill s-paused'};
  const isPhoto = key => key.startsWith('photo_');

  panel.innerHTML = `<div class="cal-detail-title">📅 ${ds} — 共 ${evs.length} 個節點</div>`
    + evs.map(ev=>`<div class="cal-ev-row">
      <span style="font-size:14px">${isPhoto(ev.ms.key)?'📷':'🎬'}</span>
      <span class="cal-ev-proj">${escHtml(ev.proj.name)}</span>
      <span class="cal-ev-ms">${ev.ms.name}</span>
      <span class="cal-ev-badge status-badge ${stClass[ev.status]||'s-paused'}">${stLabel[ev.status]||ev.status}</span>
    </div>`).join('');
  panel.style.display = 'block';
}
